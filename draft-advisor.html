<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Draft Advisor">
<meta name="theme-color" content="#0d1117">
<title>Draft Advisor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#0d1117;color:#f0f6fc;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;}
  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;}
  .screen{display:none;flex:1;overflow:hidden;flex-direction:column;}
  .screen.active{display:flex;}
  /* top bar */
  #topbar{background:#161b22;border-bottom:1px solid #30363d;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:max(10px,env(safe-area-inset-top));}
  #topbar h1{font-size:15px;font-weight:700;color:#f0f6fc;flex:1;}
  /* bottom nav */
  #bottomnav{background:#161b22;border-top:1px solid #30363d;display:flex;padding-bottom:max(8px,env(safe-area-inset-bottom));flex-shrink:0;}
  .nav-btn{flex:1;padding:8px 4px 6px;background:none;border:none;cursor:pointer;border-top:2px solid transparent;color:#8b949e;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .nav-btn.active{color:#f0f6fc;border-top-color:#1f6feb;}
  .nav-btn.my-turn{border-top-color:#10b981;color:#10b981;}
  .nav-btn span.icon{font-size:20px;}
  /* scrollable content */
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  /* cards */
  .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin-bottom:10px;}
  /* buttons */
  .btn{padding:12px 16px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;}
  .btn-green{background:#238636;color:#fff;}
  .btn-blue{background:#1f6feb;color:#fff;}
  .btn-gray{background:#21262d;color:#8b949e;}
  .btn-red{background:#da3633;color:#fff;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  /* inputs */
  .inp{width:100%;padding:11px 13px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#f0f6fc;font-size:15px;outline:none;font-family:inherit;}
  .inp:focus{border-color:#1f6feb;}
  label.lbl{display:block;color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;margin-top:14px;}
  /* badges */
  .badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;}
  .badge-GK{background:#f59e0b;color:#000;}
  .badge-DEF{background:#3b82f6;color:#fff;}
  .badge-MID{background:#10b981;color:#fff;}
  .badge-ATT{background:#ef4444;color:#fff;}
  .badge-WC{background:#8b5cf6;color:#fff;}
  /* player row */
  .player-row{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:border-color 0.15s;}
  .player-row.tapped{background:#1a2a1a;border-color:#10b981;}
  .player-row.grayed{opacity:0.35;cursor:not-allowed;}
  .player-row .pname{font-size:15px;font-weight:700;color:#f0f6fc;}
  .player-row .psub{font-size:12px;color:#8b949e;margin-top:2px;}
  .confirm-btns{display:flex;gap:8px;margin-top:10px;}
  .confirm-btns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
  .cb-yes{background:#238636;color:#fff;}
  .cb-no{background:#21262d;color:#8b949e;}
  /* club grid */
  .club-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px;}
  .club-btn{background:#161b22;border:2px solid #30363d;border-radius:10px;padding:12px 8px;cursor:pointer;text-align:center;font-family:inherit;}
  .club-btn .cdot{width:10px;height:10px;border-radius:50%;margin:0 auto 6px;}
  .club-btn .cname{color:#f0f6fc;font-size:12px;font-weight:700;line-height:1.3;}
  .club-btn .cavail{color:#484f58;font-size:10px;margin-top:3px;}
  .club-btn.grayed{opacity:0.3;cursor:not-allowed;}
  /* advice banner */
  .advice-banner{background:linear-gradient(90deg,#1a3a2a,#163020);border-bottom:1px solid #10b981;padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;}
  /* pos filter */
  .pos-filters{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto;}
  .pos-btn{padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap;font-family:inherit;}
  /* roster slot */
  .roster-slot{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:10px 14px;margin-bottom:5px;}
  .roster-slot.filled{border-color:#30363d;background:#161b22;}
  .roster-slot .rname{font-size:14px;font-weight:700;color:#f0f6fc;}
  .roster-slot .rsub{font-size:11px;color:#8b949e;margin-top:2px;}
  /* captain badge */
  .cap-badge{background:#f59e0b;color:#000;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;margin-left:6px;}
  /* warning */
  .warn{background:#1a1a0a;border:1px solid #f59e0b;border-radius:8px;padding:10px 12px;color:#f59e0b;font-size:13px;margin-bottom:10px;}
  .error-msg{background:#1a0a0a;border:1px solid #ef4444;border-radius:8px;padding:10px 12px;color:#ef4444;font-size:13px;margin-bottom:10px;}
  /* spinner */
  .spinner{display:flex;gap:5px;justify-content:center;padding:20px;}
  .dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:dp 1.2s ease-in-out infinite;}
  @keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
  /* stat card */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;}
  .stat-card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;text-align:center;}
  .stat-card .sv{font-size:22px;font-weight:700;color:#10b981;}
  .stat-card .sl{font-size:11px;color:#8b949e;margin-top:3px;}
  /* section header */
  .sec-hdr{color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;}
  /* table */
  .tbl{width:100%;border-collapse:collapse;font-size:13px;}
  .tbl th{color:#8b949e;font-size:11px;text-transform:uppercase;padding:6px 8px;text-align:left;border-bottom:1px solid #30363d;}
  .tbl td{padding:8px;border-bottom:1px solid #21262d;color:#f0f6fc;}
  .tbl tr:last-child td{border-bottom:none;}
  /* chart container */
  .chart-wrap{position:relative;height:220px;margin-bottom:10px;}
  /* captain timer */
  .cap-timer{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:700;}
  .cap-timer.green{background:#1a3a2a;color:#10b981;}
  .cap-timer.amber{background:#3a2a0a;color:#f59e0b;}
  .cap-timer.red{background:#3a0a0a;color:#ef4444;}
  /* modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;}
  .modal{background:#161b22;border-radius:16px 16px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto;border-top:1px solid #30363d;}
  .modal h3{font-size:17px;margin-bottom:14px;}
  /* setup screen */
  #setup-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
  .setup-card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:28px;width:100%;max-width:440px;}
  /* loading */
  .club-tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;margin:2px;}
  /* wide layout */
  @media(min-width:600px){
    .club-grid{grid-template-columns:repeat(3,1fr);}
    .stat-grid{grid-template-columns:repeat(3,1fr);}
    #main-layout{display:flex;flex-direction:row;flex:1;overflow:hidden;}
    #left-panel{width:55%;border-right:1px solid #30363d;display:flex;flex-direction:column;overflow:hidden;}
    #right-panel{width:45%;display:flex;flex-direction:column;overflow:hidden;}
    #bottomnav{flex-direction:column;width:70px;border-top:none;border-right:1px solid #30363d;padding-bottom:0;}
    .nav-btn{border-top:none;border-left:2px solid transparent;padding:12px 4px;}
    .nav-btn.active{border-left-color:#1f6feb;border-top:none;}
    .nav-btn.my-turn{border-left-color:#10b981;}
  }
</style>
</head>
<body>
<div id="app">
  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen active">
    <div class="setup-card">
      <div style="text-align:center;margin-bottom:24px;">
        <div style="font-size:48px;">⚽</div>
        <h1 style="font-size:24px;margin:8px 0 4px;">Draft Advisor</h1>
        <p style="color:#8b949e;font-size:13px;">Premier League Fantasy · Snake Draft</p>
      </div>
      <label class="lbl">Your Anthropic API Key</label>
      <input class="inp" id="setup-apikey" type="password" placeholder="sk-ant-api03-...">
      <label class="lbl">Your Name</label>
      <input class="inp" id="setup-myname" placeholder="e.g. Alex">
      <label class="lbl">Draft Order — one name per line, first pick at top</label>
      <textarea class="inp" id="setup-order" rows="8" style="resize:vertical;font-family:monospace;font-size:13px;" placeholder="Alex&#10;Tom&#10;Sarah&#10;James&#10;Lucy&#10;Mike"></textarea>
      <label class="lbl">Max players per club (vote on the day)</label>
      <select class="inp" id="setup-clubmax">
        <option value="2">2 players max per club</option>
        <option value="3">3 players max per club</option>
      </select>
      <div style="margin-top:16px;margin-bottom:6px;">
        <button class="btn btn-blue" id="setup-btn">Load Players & Start Draft →</button>
      </div>
      <p style="color:#484f58;font-size:12px;text-align:center;margin-top:8px;">
        Season scoring uses the free FPL API — no extra cost.
      </p>
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div id="loading-screen" class="screen" style="align-items:center;justify-content:center;padding:24px;">
    <div class="setup-card" style="text-align:center;">
      <div style="font-size:44px;margin-bottom:12px;">⚽</div>
      <h2 style="margin-bottom:6px;" id="load-title">Loading Player Pool…</h2>
      <p style="color:#8b949e;font-size:13px;margin-bottom:16px;" id="load-subtitle">Starting…</p>
      <div style="background:#0d1117;border-radius:8px;height:10px;overflow:hidden;margin-bottom:8px;">
        <div id="load-bar" style="width:0%;height:100%;background:linear-gradient(90deg,#10b981,#059669);transition:width 0.3s;border-radius:8px;"></div>
      </div>
      <p style="color:#484f58;font-size:12px;margin-bottom:16px;" id="load-pct">0%</p>
      <div id="load-clubs" style="display:flex;flex-wrap:wrap;justify-content:center;gap:3px;"></div>
      <div id="load-errors" style="margin-top:12px;"></div>
      <div id="load-total" style="color:#484f58;font-size:12px;margin-top:8px;"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-screen" class="screen">
    <!-- top bar -->
    <div id="topbar">
      <h1 id="topbar-title">Draft Advisor</h1>
      <div id="topbar-info" style="color:#8b949e;font-size:12px;"></div>
      <button id="undo-btn" class="btn btn-gray" style="width:auto;padding:7px 12px;font-size:13px;display:none;">↩ Undo</button>
    </div>

    <!-- advice banner -->
    <div id="advice-banner" class="advice-banner" style="display:none;" onclick="showTab('advice')">
      <div class="dot" style="width:8px;height:8px;flex-shrink:0;"></div>
      <span style="color:#10b981;font-weight:700;font-size:14px;">🤖 Your turn! Tap for recommendation</span>
      <span style="margin-left:auto;color:#10b981;">›</span>
    </div>

    <!-- captain expiry banner -->
    <div id="captain-banner" style="display:none;background:#3a1a0a;border-bottom:1px solid #f59e0b;padding:10px 16px;cursor:pointer;flex-shrink:0;" onclick="showTab('myteam')">
      <span style="color:#f59e0b;font-weight:700;font-size:13px;" id="captain-banner-text"></span>
    </div>

    <div id="main-layout" style="display:flex;flex:1;overflow:hidden;flex-direction:column;">
      <!-- bottom nav (or side nav on wide) -->
      <div id="bottomnav">
        <button class="nav-btn" data-tab="draft" onclick="showTab('draft')">
          <span class="icon">🏟️</span><span>Draft</span>
        </button>
        <button class="nav-btn active" data-tab="myteam" onclick="showTab('myteam')">
          <span class="icon">👤</span><span>My Team</span>
        </button>
        <button class="nav-btn" data-tab="friends" onclick="showTab('friends')">
          <span class="icon">👥</span><span>Friends</span>
        </button>
        <button class="nav-btn" data-tab="league" onclick="showTab('league')">
          <span class="icon">📊</span><span>League</span>
        </button>
        <button class="nav-btn" data-tab="settings" onclick="showTab('settings')">
          <span class="icon">⚙️</span><span>Settings</span>
        </button>
      </div>

      <!-- TAB CONTENTS -->
      <div id="tab-draft" class="scroll" style="display:none;"></div>
      <div id="tab-myteam" class="scroll" style="display:flex;flex-direction:column;"></div>
      <div id="tab-friends" class="scroll" style="display:none;"></div>
      <div id="tab-league" class="scroll" style="display:none;padding:14px;"></div>
      <div id="tab-settings" class="scroll" style="display:none;padding:14px;"></div>
      <div id="tab-advice" class="scroll" style="display:none;padding:14px;"></div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeModal(event)">
    <div class="modal" id="modal-content"></div>
  </div>
</div>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────────────
const PL_CLUBS = ["Arsenal","Aston Villa","Bournemouth","Brentford","Brighton","Chelsea","Crystal Palace","Everton","Fulham","Ipswich Town","Leicester City","Liverpool","Manchester City","Manchester United","Newcastle United","Nottingham Forest","Southampton","Tottenham Hotspur","West Ham United","Wolverhampton Wanderers"];
const CLUB_COLORS = {"Arsenal":"#EF0107","Aston Villa":"#670E36","Bournemouth":"#B50E12","Brentford":"#FF2014","Brighton":"#0057B8","Chelsea":"#034694","Crystal Palace":"#C4122E","Everton":"#274488","Fulham":"#aaaaaa","Ipswich Town":"#3A64A3","Leicester City":"#003090","Liverpool":"#C8102E","Manchester City":"#6CABDD","Manchester United":"#DA291C","Newcastle United":"#41B4D2","Nottingham Forest":"#DD0000","Southampton":"#D71920","Tottenham Hotspur":"#FFFFFF","West Ham United":"#7A263A","Wolverhampton Wanderers":"#FDB913"};
const SLOTS = {GK:2,DEF:5,MID:5,ATT:3,WC:2};
const TOTAL_PICKS = 17;
const CHART_COLORS = ["#10b981","#3b82f6","#f59e0b","#ef4444","#8b5cf6","#ec4899","#06b6d4","#84cc16","#f97316","#a855f7","#14b8a6","#eab308"];
const DB_PREFIX = "da_";
const DB_VERSION = 1;

// ── STATE ──────────────────────────────────────────────────────────────────────
let S = {
  apiKey: "",
  myName: "",
  draftOrder: [],
  clubMax: 2,
  playerPool: [],
  pickedMap: {},    // "name|club" -> pickerName
  teams: {},        // name -> {GK:[],DEF:[],MID:[],ATT:[],WC:[]}
  snakeOrder: [],
  pickIdx: 0,
  draftDone: false,
  captains: {},     // name -> {player, dateSet}
  wildcardSubs: {}, // name -> [{slotIdx, inPlayer, outPlayer, gameweek}]
  scores: {},       // gameweek -> {playerKey -> points}
  lastRefreshed: null,
  currentGW: 1,
  history: [],      // for undo
  advice: null,
  adviceLoading: false,
  defaultTab: "myteam",
  hideDraft: false,
};

// ── PERSISTENCE ────────────────────────────────────────────────────────────────
function save(key, val){ try{ localStorage.setItem(DB_PREFIX+key, JSON.stringify(val)); }catch(e){} }
function load(key, def=null){ try{ const v=localStorage.getItem(DB_PREFIX+key); return v!==null?JSON.parse(v):def; }catch(e){ return def; } }

function saveAll(){
  save("settings",{apiKey:S.apiKey,myName:S.myName,draftOrder:S.draftOrder,clubMax:S.clubMax,defaultTab:S.defaultTab,hideDraft:S.hideDraft,draftDone:S.draftDone});
  save("pool",S.playerPool);
  save("picked",S.pickedMap);
  save("teams",S.teams);
  save("snake",{snakeOrder:S.snakeOrder,pickIdx:S.pickIdx});
  save("captains",S.captains);
  save("wildcards",S.wildcardSubs);
  save("scores",S.scores);
  save("meta",{lastRefreshed:S.lastRefreshed,currentGW:S.currentGW});
}

function loadAll(){
  const settings = load("settings",{});
  S.apiKey = settings.apiKey||"";
  S.myName = settings.myName||"";
  S.draftOrder = settings.draftOrder||[];
  S.clubMax = settings.clubMax||2;
  S.defaultTab = settings.defaultTab||"myteam";
  S.hideDraft = settings.hideDraft||false;
  S.draftDone = settings.draftDone||false;
  S.playerPool = load("pool",[]);
  S.pickedMap = load("picked",{});
  S.teams = load("teams",{});
  const sn = load("snake",{});
  S.snakeOrder = sn.snakeOrder||[];
  S.pickIdx = sn.pickIdx||0;
  S.captains = load("captains",{});
  S.wildcardSubs = load("wildcards",{});
  S.scores = load("scores",{});
  const meta = load("meta",{});
  S.lastRefreshed = meta.lastRefreshed||null;
  S.currentGW = meta.currentGW||1;
}

// ── SNAKE ORDER ────────────────────────────────────────────────────────────────
function buildSnake(players, rounds){
  const o=[];
  for(let r=0;r<rounds;r++){
    const row = r%2===0 ? [...players] : [...players].reverse();
    row.forEach(p=>o.push(p));
  }
  return o;
}

// ── INIT TEAMS ─────────────────────────────────────────────────────────────────
function initTeams(){
  S.draftOrder.forEach(name=>{
    if(!S.teams[name]) S.teams[name]={GK:[],DEF:[],MID:[],ATT:[],WC:[]};
  });
}

// ── API CALL ───────────────────────────────────────────────────────────────────
async function callClaude({system, userMsg, maxTokens=1500}){
  const r = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,system,messages:[{role:"user",content:userMsg}]})
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error.message);
  return (d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

// ── JSON EXTRACT ───────────────────────────────────────────────────────────────
function extractJSON(raw){
  const a0=raw.indexOf("["),a1=raw.lastIndexOf("]");
  if(a0!==-1&&a1>a0){try{return JSON.parse(raw.slice(a0,a1+1));}catch(e){}}
  const o0=raw.indexOf("{"),o1=raw.lastIndexOf("}");
  if(o0!==-1&&o1>o0){try{return JSON.parse(raw.slice(o0,o1+1));}catch(e){}}
  throw new Error("No JSON found");
}

function normalise(p, club){
  const pm={FWD:"ATT",FOR:"ATT",STR:"ATT",FORWARD:"ATT",MIDFIELDER:"MID",DEFENDER:"DEF",GKP:"GK",GOALKEEPER:"GK"};
  const raw=(p.position||p.pos||"MID").toString().toUpperCase().trim();
  const pos=pm[raw]||raw;
  return {
    name:(p.name||p.player||"Unknown").toString().trim(),
    club: club, // always use canonical club name
    position:["GK","DEF","MID","ATT"].includes(pos)?pos:"MID",
    fplPrice:parseFloat(p.fplPrice||p.price||p.cost||0)||0,
    lastSeasonPts:parseInt(p.lastSeasonPts||p.points||p.pts||0)||0,
    rating:parseFloat(p.rating||p.score||5)||5,
    fplId:p.fplId||p.id||null,
  };
}

// ── PLAYER LOADING ─────────────────────────────────────────────────────────────
async function fetchClub(club){
  const today = new Date().toDateString();
  const system = `You are a Premier League fantasy football expert. Today is ${today}.
Return the first-team squad for ${club} in the 2025-26 Premier League season including all summer 2025 transfers.
Return ONLY a raw JSON array starting with [. No markdown, no explanation.
Each object: {"name":string,"position":"GK"|"DEF"|"MID"|"ATT","fplPrice":number,"lastSeasonPts":number,"rating":number}
Aim for 20-25 players. fplPrice in £m (e.g. 8.5). lastSeasonPts from FPL 2024-25 (0 if new signing). rating 1-10.`;
  const raw = await callClaude({system, userMsg:`Return ${club} 2025-26 squad as JSON array.`, maxTokens:2000});
  if(!raw||raw.trim().length===0) throw new Error("Empty response");
  const parsed = extractJSON(raw);
  if(!Array.isArray(parsed)||parsed.length<5) throw new Error(`Only ${parsed?parsed.length:0} players`);
  return parsed.map(p=>normalise(p,club));
}

async function loadAllPlayers(){
  showScreen("loading");
  const clubCounts = {};
  const errors = [];
  let pool = [];

  for(let i=0;i<PL_CLUBS.length;i++){
    const club = PL_CLUBS[i];
    updateLoadUI(i, PL_CLUBS.length, club, clubCounts, errors, pool.length);
    try{
      const players = await fetchClub(club);
      clubCounts[club] = players.length;
      pool = pool.concat(players);
    }catch(e){
      clubCounts[club] = 0;
      errors.push(`${club}: ${e.message}`);
      console.warn(`${club} failed:`, e.message);
    }
    updateLoadUI(i+1, PL_CLUBS.length, club, clubCounts, errors, pool.length);
  }

  // dedupe
  const seen = new Set();
  pool = pool.filter(p=>{
    const k=(p.name+"|"+p.club).toLowerCase();
    if(seen.has(k)) return false;
    seen.add(k); return true;
  }).sort((a,b)=>b.rating-a.rating);

  S.playerPool = pool;
  save("pool", pool);
  updateLoadUI(PL_CLUBS.length, PL_CLUBS.length, "Complete", clubCounts, errors, pool.length);
  return pool;
}

function updateLoadUI(done, total, club, counts, errors, totalPlayers){
  const pct = Math.round((done/total)*100);
  document.getElementById("load-bar").style.width = pct+"%";
  document.getElementById("load-pct").textContent = pct+"%";
  document.getElementById("load-subtitle").textContent = done<total ? `${club} (${done}/${total} clubs)` : "Finalising…";
  document.getElementById("load-total").textContent = totalPlayers > 0 ? `${totalPlayers} players loaded so far` : "";

  const clubsEl = document.getElementById("load-clubs");
  clubsEl.innerHTML = PL_CLUBS.map((c,i)=>{
    const cnt = counts[c];
    const isDone = i < done;
    const thin = isDone && cnt !== undefined && cnt < 10;
    const bg = isDone ? (thin?"#3a1a1a":"#1a3a2a") : "#1c2128";
    const col = isDone ? (thin?"#ef4444":"#10b981") : "#484f58";
    const bdr = isDone ? (thin?"#ef4444":"#238636") : "#30363d";
    const label = isDone ? (thin?`⚠ ${c} (${cnt})`:`✓ ${c} (${cnt})`) : c;
    return `<span class="club-tag" style="background:${bg};color:${col};border:1px solid ${bdr};">${label}</span>`;
  }).join("");

  if(errors.length>0){
    document.getElementById("load-errors").innerHTML = `<div class="error-msg">⚠ ${errors.length} clubs failed:<br>${errors.slice(0,5).map(e=>`<small>${e}</small>`).join("<br>")}</div>`;
  }
}

// ── FPL SCORE REFRESH ──────────────────────────────────────────────────────────
async function refreshScores(){
  try{
    // Get current gameweek from FPL
    const r = await fetch("https://fantasy.premierleague.com/api/bootstrap-static/");
    const d = await r.json();
    const events = d.events||[];
    const currentEvent = events.find(e=>e.is_current) || events.find(e=>e.is_next) || events[0];
    if(!currentEvent) return;
    const gw = currentEvent.id;
    S.currentGW = gw;

    // Build fplId map from player names
    const fplPlayers = d.elements||[];
    const nameToId = {};
    fplPlayers.forEach(p=>{
      const key = (p.web_name||"").toLowerCase();
      nameToId[key] = p.id;
      const full = ((p.first_name||"")+" "+(p.second_name||"")).toLowerCase().trim();
      nameToId[full] = p.id;
    });

    // Fetch scores for current and previous gameweeks not yet in S.scores
    const gwsNeeded = [];
    for(let g=1;g<=gw;g++){
      if(!S.scores[g]) gwsNeeded.push(g);
    }

    for(const g of gwsNeeded){
      try{
        const gr = await fetch(`https://fantasy.premierleague.com/api/event/${g}/live/`);
        const gd = await gr.json();
        const gwScores = {};
        (gd.elements||[]).forEach(el=>{
          gwScores[el.id] = el.stats?.total_points||0;
        });
        // Map to our player keys
        const mapped = {};
        getAllPlayers().forEach(p=>{
          const nameLow = p.name.toLowerCase();
          const fplId = p.fplId || nameToId[nameLow] || nameToId[p.name.split(" ").pop().toLowerCase()];
          if(fplId && gwScores[fplId]!==undefined){
            mapped[p.name+"|"+p.club] = gwScores[fplId];
          }
        });
        S.scores[g] = mapped;
      }catch(e){ console.warn(`GW ${g} failed:`, e); }
    }

    S.lastRefreshed = new Date().toISOString();
    save("scores", S.scores);
    save("meta", {lastRefreshed:S.lastRefreshed, currentGW:S.currentGW});
    return true;
  }catch(e){
    console.error("Score refresh failed:", e);
    return false;
  }
}

// ── SCORING HELPERS ────────────────────────────────────────────────────────────
function getAllPlayers(){
  const all = [];
  S.draftOrder.forEach(name=>{
    const team = S.teams[name]||{};
    ["GK","DEF","MID","ATT","WC"].forEach(pos=>{
      (team[pos]||[]).forEach(p=>all.push(p));
    });
  });
  return all;
}

function getPlayerTotalPts(playerKey, playerName, ownerName, upToGW){
  const cap = S.captains[ownerName];
  const isCaptain = cap && (cap.player.name+"|"+cap.player.club)===playerKey;
  const sub = (S.wildcardSubs[ownerName]||[]).find(s=>(s.outPlayer.name+"|"+s.outPlayer.club)===playerKey);
  const subGW = sub ? sub.gameweek : null;

  let total = 0;
  const maxGW = upToGW || S.currentGW;
  for(let g=1;g<=maxGW;g++){
    if(subGW && g >= subGW) continue; // subbed out, no longer scoring
    const gwScores = S.scores[g]||{};
    const pts = gwScores[playerKey]||0;
    total += isCaptain ? pts*2 : pts;
  }
  return total;
}

function getPersonTotalPts(name, upToGW){
  const team = S.teams[name]||{};
  let total = 0;
  ["GK","DEF","MID","ATT","WC"].forEach(pos=>{
    (team[pos]||[]).forEach(p=>{
      const key = p.name+"|"+p.club;
      total += getPlayerTotalPts(key, p.name, name, upToGW);
    });
  });
  return total;
}

function getPersonGWPts(name, gw){
  const team = S.teams[name]||{};
  const cap = S.captains[name];
  let total = 0;
  const gwScores = S.scores[gw]||{};
  ["GK","DEF","MID","ATT","WC"].forEach(pos=>{
    (team[pos]||[]).forEach(p=>{
      const key = p.name+"|"+p.club;
      const sub = (S.wildcardSubs[name]||[]).find(s=>(s.outPlayer.name+"|"+s.outPlayer.club)===key);
      if(sub && gw >= sub.gameweek) return;
      const pts = gwScores[key]||0;
      const isCap = cap && (cap.player.name+"|"+cap.player.club)===key;
      total += isCap ? pts*2 : pts;
    });
  });
  return total;
}

// ── CAPTAIN HELPERS ────────────────────────────────────────────────────────────
function captainDaysLeft(name){
  const cap = S.captains[name];
  if(!cap) return null;
  const set = new Date(cap.dateSet);
  const expires = new Date(set);
  expires.setMonth(expires.getMonth()+3);
  const now = new Date();
  return Math.ceil((expires-now)/(1000*60*60*24));
}

function captainTimerHtml(name){
  const days = captainDaysLeft(name);
  if(days===null) return "";
  const cls = days<=0?"red":days<=7?"amber":"green";
  const label = days<=0?"EXPIRED":`${days}d left`;
  return `<span class="cap-timer ${cls}">${label}</span>`;
}

// ── CLUB LIMIT CHECK ───────────────────────────────────────────────────────────
function clubCountForPicker(pickerName, club){
  const team = S.teams[pickerName]||{};
  let count = 0;
  ["GK","DEF","MID","ATT"].forEach(pos=>{
    (team[pos]||[]).forEach(p=>{ if(p.club===club) count++; });
  });
  return count;
}

function isClubBlocked(pickerName, club){
  return clubCountForPicker(pickerName, club) >= S.clubMax;
}

// ── DRAFT CORE ─────────────────────────────────────────────────────────────────
function currentPicker(){ return S.snakeOrder[S.pickIdx]||"—"; }
function isMyTurn(){ return currentPicker()===S.myName; }

function available(){
  return S.playerPool.filter(p=>!S.pickedMap[p.name+"|"+p.club]);
}

function confirmPick(player, picker){
  const key = player.name+"|"+player.club;
  // Save history
  S.history.push({
    player, picker,
    pickIdx: S.pickIdx,
    teamsSnapshot: JSON.parse(JSON.stringify(S.teams)),
    pickedSnapshot: JSON.parse(JSON.stringify(S.pickedMap)),
  });

  S.pickedMap[key] = picker;
  const team = S.teams[picker];
  const pos = player.position;
  const hasSlot = (SLOTS[pos]||0)-(team[pos]||[]).length > 0;
  const slot = hasSlot ? pos : "WC";
  team[slot].push(player);
  S.pickIdx++;

  if(S.pickIdx >= S.snakeOrder.length){
    S.draftDone = true;
    S.hideDraft = true;
  }

  saveAll();
  renderTopBar();
  checkAdviceBanner();
  checkCaptainBanner();
  renderDraftTab();
}

function undoPick(){
  if(S.history.length===0) return;
  const last = S.history.pop();
  S.pickedMap = last.pickedSnapshot;
  S.teams = last.teamsSnapshot;
  S.pickIdx = last.pickIdx;
  S.draftDone = false;
  S.hideDraft = false;
  S.advice = null;
  saveAll();
  renderTopBar();
  checkAdviceBanner();
  renderDraftTab();
}

// ── ADVICE ─────────────────────────────────────────────────────────────────────
async function generateAdvice(){
  S.adviceLoading = true;
  S.advice = null;
  renderAdviceTab();

  const avail = available();
  const myTeam = S.teams[S.myName]||{};
  const slotsLeft = {};
  Object.keys(SLOTS).forEach(pos=>{ slotsLeft[pos]=SLOTS[pos]-(myTeam[pos]||[]).length; });
  const totalLeft = Object.values(slotsLeft).reduce((a,b)=>a+b,0);
  const topGKs = avail.filter(p=>p.position==="GK"&&p.rating>=7).length;
  const upcoming = S.snakeOrder.slice(S.pickIdx+1);
  const nextTurn = upcoming.findIndex(n=>n===S.myName);

  // Club counts for blocking insight
  const myClubCounts = {};
  ["GK","DEF","MID","ATT"].forEach(pos=>{
    (myTeam[pos]||[]).forEach(p=>{ myClubCounts[p.club]=(myClubCounts[p.club]||0)+1; });
  });
  const blockedClubs = Object.entries(myClubCounts).filter(([c,n])=>n>=S.clubMax).map(([c])=>c);

  try{
    const rec = await callClaude({
      maxTokens:500,
      system:`Elite PL fantasy draft strategist. Today: ${new Date().toDateString()}.
MY TEAM: ${JSON.stringify(myTeam)}
SLOTS NEEDED: ${JSON.stringify(slotsLeft)} (${totalLeft} picks left)
PICKS UNTIL NEXT TURN: ${nextTurn<0?"last pick":nextTurn}
TOP GKs AVAILABLE (rated 7+): ${topGKs}
CLUBS I CANNOT PICK FROM (at limit): ${blockedClubs.join(", ")||"none"}
MAX PLAYERS PER CLUB: ${S.clubMax}
TOP 80 AVAILABLE: ${JSON.stringify(avail.slice(0,80).map(p=>({name:p.name,club:p.club,pos:p.position,price:p.fplPrice,pts:p.lastSeasonPts,rating:p.rating})))}
NEXT 20 PICKS: ${S.snakeOrder.slice(S.pickIdx,S.pickIdx+20).join(", ")}
Return JSON only: {"pick":{"name":"","club":"","position":"","fplPrice":0,"lastSeasonPts":0,"rating":0},"reason":"2-3 sentences","scarcity":"one line or empty","nextTarget":"brief note"}`,
      userMsg:"Recommend my next draft pick as JSON.",
    });
    S.advice = extractJSON(rec);
  }catch(e){
    S.advice = {pick:avail[0]||null, reason:"Could not generate recommendation. Pick highest rated available player for your most needed position.", scarcity:"", nextTarget:""};
  }
  S.adviceLoading = false;
  renderAdviceTab();
}

// ── RENDER: TOP BAR ────────────────────────────────────────────────────────────
function renderTopBar(){

  document.getElementById("topbar-title").textContent = myT ? "🟢 YOUR TURN" : `${picker}'s pick`;
  document.getElementById("topbar-info").textContent = S.draftDone ? "Draft complete" : `Pick ${S.pickIdx+1}/${S.snakeOrder.length}`;

    b.classList.toggle("my-turn", myT&&!S.draftDone);

function checkAdviceBanner(){
  const banner = document.getElementById("advice-banner");
  const show = isMyTurn() && !S.draftDone;
  banner.style.display = show ? "flex" : "none";

function checkCaptainBanner(){

// ── RENDER: DRAFT TAB ──────────────────────────────────────────────────────────
let selectedClub = null;
let posFilter = "ALL";
let tappedPlayer = null;

function renderDraftTab(){
  const el = document.getElementById("tab-draft");
  if(S.draftDone){ el.innerHTML = `<div style="padding:40px;text-align:center;color:#8b949e;">🏆 Draft complete!<br><br>Good luck this season.</div>`; return; }

  if(!selectedClub){
    renderClubGrid(el);
  } else {
    renderClubPlayers(el);
  }
}

function renderClubGrid(el){
  const picker = currentPicker();
  const avail = available();
  let html = `<div style="padding:12px 14px 4px;"><div class="sec-hdr">Select Club — ${picker}'s pick</div></div><div class="club-grid">`;
  PL_CLUBS.forEach(club=>{
    const clubAvail = avail.filter(p=>p.club===club);
    const total = S.playerPool.filter(p=>p.club===club).length;
    const picked = total - clubAvail.length;
    const blocked = isClubBlocked(picker, club);
    const col = CLUB_COLORS[club]||"#30363d";
    const gray = clubAvail.length===0||blocked ? " grayed" : "";
    const blockLabel = blocked ? `<div style="color:#ef4444;font-size:10px;">Limit reached</div>` : "";
    html += `<button class="club-btn${gray}" onclick="selectClub('${club}')" style="border-color:${col};">
      <div class="cdot" style="background:${col};border:1px solid rgba(255,255,255,0.2);"></div>
      <div class="cname">${club}</div>
      <div class="cavail">${clubAvail.length} available</div>
      ${picked>0?`<div style="color:#484f58;font-size:10px;">${picked} picked</div>`:""}
      ${blockLabel}
    </button>`;
  });
  // Free-type WC option
  html += `<button class="club-btn" onclick="openWildcardModal()" style="border-color:#8b5cf6;border-style:dashed;">
    <div class="cdot" style="background:#8b5cf6;"></div>
    <div class="cname" style="color:#8b5cf6;">Non-PL Wildcard</div>
    <div class="cavail">Free type a player</div>
  </button>`;
  html += `</div>`;
  el.innerHTML = html;
}

function selectClub(club){
  const picker = currentPicker();
  if(isClubBlocked(picker, club)){
    showToast(`${picker} already has ${S.clubMax} players from ${club}`); return;
  }
  selectedClub = club;
  posFilter = "ALL";
  tappedPlayer = null;
  renderClubPlayers(document.getElementById("tab-draft"));
}

function renderClubPlayers(el){
  const picker = currentPicker();
  const avail = available().filter(p=>p.club===selectedClub && (posFilter==="ALL"||p.position===posFilter));
  const col = CLUB_COLORS[selectedClub]||"#fff";

  let html = `<div style="padding:12px 14px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <button onclick="selectedClub=null;tappedPlayer=null;renderDraftTab();" class="btn btn-gray" style="width:auto;padding:7px 12px;font-size:13px;">← Clubs</button>
      <div style="flex:1;font-weight:700;font-size:15px;">${selectedClub}</div>
      <div style="width:12px;height:12px;border-radius:50%;background:${col};"></div>
    </div>
    <div class="pos-filters">`;
  ["ALL","GK","DEF","MID","ATT"].forEach(pos=>{
    const active = posFilter===pos;
    const bg = active ? (pos==="ALL"?"#30363d":`var(--p-${pos},"#333")`) : "#21262d";
    const posColors = {GK:"#f59e0b",DEF:"#3b82f6",MID:"#10b981",ATT:"#ef4444"};
    const bgCol = active ? (pos==="ALL"?"#30363d":(posColors[pos]||"#333")) : "#21262d";
    const txtCol = active ? (pos==="ALL"?"#fff":"#fff") : "#8b949e";
    html += `<button class="pos-btn" onclick="posFilter='${pos}';renderClubPlayers(document.getElementById('tab-draft'));" style="background:${bgCol};color:${txtCol};">${pos}</button>`;
  });
  html += `</div></div>`;

  const allAvail = available().filter(p=>p.club===selectedClub);
  if(allAvail.length===0){
    html += `<div style="padding:30px;text-align:center;color:#484f58;">No available players from ${selectedClub}</div>`;
  } else if(avail.length===0){
    html += `<div style="padding:20px;text-align:center;color:#484f58;">No available ${posFilter} from ${selectedClub}</div>`;
  } else {
    html += `<div style="padding:0 14px 14px;">`;
    avail.forEach(p=>{
      const key = p.name+"|"+p.club;
      const isTapped = tappedPlayer && tappedPlayer.name===p.name && tappedPlayer.club===p.club;
      html += `<div class="player-row${isTapped?" tapped":""}" onclick="tapPlayer('${p.name}','${p.club}')">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="badge badge-${p.position}">${p.position}</span>
          <div style="flex:1;">
            <div class="pname">${p.name}</div>
            <div class="psub">£${p.fplPrice}m · ${p.lastSeasonPts}pts · ⭐${p.rating}/10</div>
          </div>
        </div>`;
      if(isTapped){
        html += `<div class="confirm-btns">
          <button class="cb-yes" onclick="event.stopPropagation();doConfirmPick()">✓ Pick for ${picker}</button>
          <button class="cb-no" onclick="event.stopPropagation();tappedPlayer=null;renderDraftTab();">✗ Cancel</button>
        </div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  }
  el.innerHTML = html;
}

function tapPlayer(name, club){
  const p = available().find(p=>p.name===name&&p.club===club);
  if(!p) return;
  if(tappedPlayer&&tappedPlayer.name===name&&tappedPlayer.club===club){ tappedPlayer=null; }
  else { tappedPlayer=p; }
  renderClubPlayers(document.getElementById("tab-draft"));
}

function doConfirmPick(){
  if(!tappedPlayer) return;
  const picker = currentPicker();
  // Club limit check
  if(tappedPlayer.position!=="WC" && isClubBlocked(picker, tappedPlayer.club)){
    showToast(`Cannot pick — ${picker} already has ${S.clubMax} players from ${tappedPlayer.club}`);
    tappedPlayer=null; renderDraftTab(); return;

  confirmPick(tappedPlayer, picker);
  tappedPlayer=null;
  selectedClub=null;
  showTab(isMyTurn()&&!S.draftDone ? "advice" : "draft");

// ── CAPTAIN MODAL ──────────────────────────────────────────────────────────────
function openCaptainModal(personName){
  const team = S.teams[personName]||{};
  const existing = S.captains[personName];
  // All players except first pick
  const firstPickKey = S.history.length>0 ? null : null; // first pick is first in snakeOrder for this person
  const firstPickIdx = S.snakeOrder.indexOf(personName);
  const allPicked = Object.entries(S.pickedMap).filter(([k,v])=>v===personName).map(([k])=>k);
  // Cannot be the very first pick of this person
  const myFirstPickKey = allPicked[0]||null;

  let players = [];
  ["GK","DEF","MID","ATT"].forEach(pos=>{
    (team[pos]||[]).forEach(p=>players.push(p));
  });

  let html = `<h3>Nominate Captain for ${personName}</h3>
    <p style="color:#8b949e;font-size:13px;margin-bottom:14px;">Cannot be their first pick. Points doubled for up to 3 months.</p>`;

  players.forEach(p=>{
    const key=p.name+"|"+p.club;
    const isFirst=key===myFirstPickKey;
    const isCurrent=existing&&(existing.player.name+"|"+existing.player.club)===key;
    if(isFirst) return;
    html+=`<div class="player-row${isCurrent?" tapped":""}" onclick="setCaptain('${personName}','${p.name}','${p.club}')">
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="badge badge-${p.position}">${p.position}</span>
        <div style="flex:1;"><div class="pname">${p.name}${isCurrent?' <span class="cap-badge">Current C</span>':""}</div>
        <div class="psub">${p.club}</div></div>
      </div>
    </div>`;
  });
  showModal(html);
}

function setCaptain(personName, pName, pClub){
  const team = S.teams[personName]||{};
  let player = null;
  ["GK","DEF","MID","ATT"].forEach(pos=>{ (team[pos]||[]).forEach(p=>{ if(p.name===pName&&p.club===pClub) player=p; }); });
  if(!player) return;
  S.captains[personName] = {player, dateSet: new Date().toISOString()};
  save("captains", S.captains);
  closeModal();
  checkCaptainBanner();
  renderMyTeamTab();
  renderFriendsTab();
}

// ── WILDCARD SUB MODAL ─────────────────────────────────────────────────────────
function openSubModal(personName, wcIdx){
  const team = S.teams[personName]||{};
  const wcPlayer = (team.WC||[])[wcIdx];
  if(!wcPlayer) return;

  let html = `<h3>Sub In ${wcPlayer.name}</h3>
    <p style="color:#8b949e;font-size:13px;margin-bottom:14px;">Select a player to replace. They will be permanently removed from scoring.</p>`;

  ["GK","DEF","MID","ATT"].forEach(pos=>{
    (team[pos]||[]).forEach((p,i)=>{
      const key=p.name+"|"+p.club;
      const alreadyOut=(S.wildcardSubs[personName]||[]).find(s=>(s.outPlayer.name+"|"+s.outPlayer.club)===key);
      if(alreadyOut) return;
      html+=`<div class="player-row" onclick="confirmSub('${personName}',${wcIdx},'${p.name}','${p.club}','${pos}',${i})">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="badge badge-${p.position}">${p.position}</span>
          <div style="flex:1;"><div class="pname">${p.name}</div><div class="psub">${p.club}</div></div>
        </div>
      </div>`;
    });
  });
  showModal(html);
}

function confirmSub(personName, wcIdx, outName, outClub, outPos, outIdx){
  const team = S.teams[personName]||{};
  const wcPlayer = (team.WC||[])[wcIdx];
  const outPlayer = (team[outPos]||[])[outIdx];
  if(!wcPlayer||!outPlayer){ closeModal(); return; }

  if(!S.wildcardSubs[personName]) S.wildcardSubs[personName]=[];
  S.wildcardSubs[personName].push({
    inPlayer:wcPlayer, outPlayer, gameweek:S.currentGW, wcIdx, outPos, outIdx
  });
  save("wildcards",S.wildcardSubs);
  closeModal();
  renderMyTeamTab();
  if(viewingFriend===personName) renderFriendDetail(document.getElementById("tab-friends"),personName);
}

function resolveWildcard(personName, wcIdx){
  showModal(`<h3>Resolve Wildcard</h3>
    <p style="color:#8b949e;font-size:13px;margin-bottom:14px;">This player should now be at a PL club. Enter their new club to link them to FPL scoring.</p>
    <label class="lbl">Premier League Club</label>
    <select class="inp" id="resolve-club" style="margin-bottom:14px;">${PL_CLUBS.map(c=>`<option>${c}</option>`).join("")}</select>
    <button class="btn btn-blue" onclick="doResolveWildcard('${personName}',${wcIdx})">Resolve</button>`);
}

function doResolveWildcard(personName, wcIdx){
  const club = document.getElementById("resolve-club").value;
  const team = S.teams[personName];
  if(!team||!team.WC[wcIdx]) return;
  team.WC[wcIdx].club = club;
  team.WC[wcIdx].isNonPL = false;
  save("teams",S.teams);
  closeModal();
  renderMyTeamTab();
}

function drawCumulChart(){
  const ctx = document.getElementById("cumul-chart");
  if(!ctx) return;
  if(cumulChart){ cumulChart.destroy(); }
  const gws = Array.from({length:S.currentGW},(_,i)=>i+1);
  const datasets = S.draftOrder.map((name,i)=>({
    label:name,
    data:gws.map(g=>getPersonTotalPts(name,g)),
    borderColor:CHART_COLORS[i%CHART_COLORS.length],
    backgroundColor:"transparent",
    borderWidth:name===S.myName?3:1.5,
    pointRadius:3,
    tension:0.3,
  }));
  cumulChart = new Chart(ctx,{
    type:"line",
    data:{labels:gws.map(g=>`GW${g}`),datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#8b949e",font:{size:11}}}},scales:{x:{ticks:{color:"#484f58",font:{size:10}}},y:{ticks:{color:"#484f58",font:{size:10}},grid:{color:"#21262d"}}}}
  });
}

function drawGWChart(){
  const ctx = document.getElementById("gw-chart");
  if(!ctx) return;
  if(gwChart){ gwChart.destroy(); }
  const gws = Array.from({length:S.currentGW},(_,i)=>i+1);
  const datasets = S.draftOrder.map((name,i)=>({
    label:name,
    data:gws.map(g=>getPersonGWPts(name,g)),
    borderColor:CHART_COLORS[i%CHART_COLORS.length],

    borderWidth:name===S.myName?3:1.5,

    tension:0.3,
  }));
  gwChart = new Chart(ctx,{
    type:"line",

    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#8b949e",font:{size:11}}}},scales:{x:{ticks:{color:"#484f58",font:{size:10}}},y:{ticks:{color:"#484f58",font:{size:10}},grid:{color:"#21262d"}}}}
  });
}

function renderStatsSection(standings){
  // Top individual players
  let allPlayerPts = [];
  S.draftOrder.forEach(name=>{
    const team=S.teams[name]||{};
    ["GK","DEF","MID","ATT"].forEach(pos=>{
      (team[pos]||[]).forEach(p=>{
        const pts=getPlayerTotalPts(p.name+"|"+p.club,p.name,name);
        allPlayerPts.push({name:p.name,club:p.club,pos:p.position,owner:name,pts});
      });
    });
  });
  allPlayerPts.sort((a,b)=>b.pts-a.pts);
  const top5=allPlayerPts.slice(0,5);
  const bot5=allPlayerPts.slice(-5).reverse();

  // Best GW per person
  const bestGW = S.draftOrder.map(name=>{
    let best=0,bestGw=0;
    for(let g=1;g<=S.currentGW;g++){
      const pts=getPersonGWPts(name,g);
      if(pts>best){best=pts;bestGw=g;}
    }
    return {name,pts:best,gw:bestGw};
  }).sort((a,b)=>b.pts-a.pts);

  let html = `<div class="sec-hdr">Top 5 Individual Players</div>
    <table class="tbl" style="margin-bottom:16px;"><thead><tr><th>#</th><th>Player</th><th>Club</th><th>Owner</th><th>Pts</th></tr></thead><tbody>`;
  top5.forEach((p,i)=>{ html+=`<tr><td>${i+1}</td><td><span class="badge badge-${p.pos}">${p.pos}</span> ${p.name}</td><td style="font-size:12px;">${p.club}</td><td style="font-size:12px;">${p.owner}</td><td style="color:#10b981;font-weight:700;">${p.pts}</td></tr>`; });
  html+=`</tbody></table>`;

  html+=`<div class="sec-hdr">Bottom 5 Individual Players</div>
    <table class="tbl" style="margin-bottom:16px;"><thead><tr><th>#</th><th>Player</th><th>Club</th><th>Owner</th><th>Pts</th></tr></thead><tbody>`;
  bot5.forEach((p,i)=>{ html+=`<tr><td>${i+1}</td><td><span class="badge badge-${p.pos}">${p.pos}</span> ${p.name}</td><td style="font-size:12px;">${p.club}</td><td style="font-size:12px;">${p.owner}</td><td style="color:#ef4444;font-weight:700;">${p.pts}</td></tr>`; });
  html+=`</tbody></table>`;

  html+=`<div class="sec-hdr">Best Single Gameweek</div>
    <table class="tbl" style="margin-bottom:16px;"><thead><tr><th>Name</th><th>Best GW</th><th>Points</th></tr></thead><tbody>`;
  bestGW.forEach(b=>{ html+=`<tr><td style="font-weight:700;">${b.name}${b.name===S.myName?" 👤":""}</td><td>GW${b.gw||"-"}</td><td style="color:#10b981;font-weight:700;">${b.pts}</td></tr>`; });
  html+=`</tbody></table>`;

  return html;
}

    html+=`<div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 12px;color:#ef4444;font-size:13px;margin-bottom:10px;">⚠️ ${S.advice.scarcity}</div>`;

function acceptAdvice(){
  if(!S.advice||!S.advice.pick) return;
  const p=S.advice.pick;
  // Find in pool
  const found=S.playerPool.find(pl=>pl.name===p.name&&pl.club===p.club)||S.playerPool.find(pl=>pl.name===p.name);
  if(!found){ showToast("Player not found in pool — please pick manually."); overrideAdvice(); return; }
  S.advice=null;
  confirmPick(found, S.myName);
  selectedClub=null;
  showTab("draft");
}

function overrideAdvice(){
  S.advice=null;
  showTab("draft");
}

    <div class="sec-hdr">Settings</div>
    <div class="card">
      <label class="lbl" style="margin-top:0;">Anthropic API Key</label>
      <input class="inp" id="s-apikey" type="password" value="${S.apiKey}" placeholder="sk-ant-api03-...">
      <label class="lbl">Default Tab on Open</label>
      <select class="inp" id="s-defaulttab">
        <option value="myteam" ${S.defaultTab==="myteam"?"selected":""}>My Team</option>
        <option value="league" ${S.defaultTab==="league"?"selected":""}>League</option>
        <option value="friends" ${S.defaultTab==="friends"?"selected":""}>Friends</option>
      </select>
      <label class="lbl">Show Draft Tab</label>
      <select class="inp" id="s-hidedraft">
        <option value="false" ${!S.hideDraft?"selected":""}>Visible</option>
        <option value="true" ${S.hideDraft?"selected":""}>Hidden</option>
      </select>
      <button class="btn btn-blue" style="margin-top:14px;" onclick="saveSettings()">Save Settings</button>
    </div>
    <div class="card" style="margin-top:0;">
      <div style="color:#f0f6fc;font-weight:700;margin-bottom:6px;">Data</div>
      <div style="color:#8b949e;font-size:12px;margin-bottom:12px;">Player pool: ${S.playerPool.length} players · Scores: GW${S.currentGW} · Last refresh: ${S.lastRefreshed?new Date(S.lastRefreshed).toLocaleDateString():"Never"}</div>
      <button class="btn btn-gray" style="margin-bottom:8px;" onclick="doRefreshScores()">🔄 Refresh Scores Now</button>
      <button class="btn btn-red" onclick="confirmReset()">⚠ Reset All Data</button>
    </div>
  `;
}

function saveSettings(){
  S.apiKey=document.getElementById("s-apikey").value.trim();
  S.defaultTab=document.getElementById("s-defaulttab").value;
  S.hideDraft=document.getElementById("s-hidedraft").value==="true";
  save("settings",{apiKey:S.apiKey,myName:S.myName,draftOrder:S.draftOrder,clubMax:S.clubMax,defaultTab:S.defaultTab,hideDraft:S.hideDraft,draftDone:S.draftDone});
  showToast("Settings saved ✓");
  renderTopBar();
}

function confirmReset(){
  showModal(`<h3>⚠ Reset All Data</h3>
    <p style="color:#8b949e;margin-bottom:14px;">This will erase all draft picks, scores, and teams. Cannot be undone.</p>
    <button class="btn btn-red" onclick="doReset()">Yes, Reset Everything</button>
    <button class="btn btn-gray" style="margin-top:8px;" onclick="closeModal()">Cancel</button>`);
}

function doReset(){
  Object.keys(localStorage).filter(k=>k.startsWith(DB_PREFIX)).forEach(k=>localStorage.removeItem(k));
  location.reload();
}

// ── TAB NAVIGATION ─────────────────────────────────────────────────────────────
function showTab(tabId){
  document.querySelectorAll("[id^='tab-']").forEach(el=>el.style.display="none");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  const tabEl=document.getElementById("tab-"+tabId);
  if(tabEl) tabEl.style.display="flex";
  document.querySelectorAll(`.nav-btn[data-tab='${tabId}']`).forEach(b=>b.classList.add("active"));

  // Render content
  if(tabId==="draft") renderDraftTab();
  else if(tabId==="myteam") renderMyTeamTab();
  else if(tabId==="friends") renderFriendsTab();
  else if(tabId==="league") renderLeagueTab();
  else if(tabId==="advice") renderAdviceTab();
  else if(tabId==="settings") renderSettingsTab();
}

// ── SCREEN NAVIGATION ─────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  const el=document.getElementById(id+"-screen");
  if(el) el.classList.add("active");
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function showModal(html){
  document.getElementById("modal-content").innerHTML=html;
  document.getElementById("modal-overlay").style.display="flex";
}
function closeModal(e){
  if(e&&e.target!==document.getElementById("modal-overlay")) return;
  document.getElementById("modal-overlay").style.display="none";
}
window.closeModal=closeModal;

// ── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.style.cssText="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;z-index:999;transition:opacity 0.3s;"; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1";
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.opacity="0",2500);
}

// ── SETUP FLOW ────────────────────────────────────────────────────────────────
document.getElementById("setup-btn").addEventListener("click", async()=>{
  const apiKey=document.getElementById("setup-apikey").value.trim();
  const myName=document.getElementById("setup-myname").value.trim();
  const orderRaw=document.getElementById("setup-order").value.trim().split("\n").map(l=>l.trim()).filter(Boolean);
  const clubMax=parseInt(document.getElementById("setup-clubmax").value);

  if(!apiKey){ showToast("Please enter your API key"); return; }
  if(!myName){ showToast("Please enter your name"); return; }
  if(orderRaw.length<2){ showToast("Enter at least 2 names"); return; }
  if(!orderRaw.includes(myName)){ showToast("Your name must be in the draft order"); return; }

  S.apiKey=apiKey; S.myName=myName; S.draftOrder=orderRaw; S.clubMax=clubMax;
  S.snakeOrder=buildSnake(orderRaw,TOTAL_PICKS);
  initTeams();
  saveAll();

  await loadAllPlayers();

  showScreen("main");
  renderTopBar();
  checkAdviceBanner();
  checkCaptainBanner();
  document.getElementById("undo-btn").addEventListener("click",undoPick);
  showTab("draft");
  if(isMyTurn()) generateAdvice();
});

// ── BOOT ──────────────────────────────────────────────────────────────────────
(function boot(){
  loadAll();
  if(S.myName && S.draftOrder.length>0 && S.playerPool.length>0){
    showScreen("main");
    renderTopBar();
    checkAdviceBanner();
    checkCaptainBanner();
    document.getElementById("undo-btn").addEventListener("click",undoPick);
    showTab(S.defaultTab||"myteam");
  } else {
    showScreen("setup");
    // Pre-fill saved API key if any
    if(S.apiKey) document.getElementById("setup-apikey").value=S.apiKey;
  }
})();
</script>
</body>
</html>
