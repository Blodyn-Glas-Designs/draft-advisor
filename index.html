<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Draft Advisor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/draft-advisor/manifest.json">
<title>Draft Advisor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0d1117;color:#f0f6fc;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;}
#app{height:100vh;height:100dvh;position:relative;}
.screen{display:none;position:absolute;inset:0;flex-direction:column;overflow:hidden;background:#0d1117;}
.screen.active{display:flex;}
#topbar{background:#161b22;border-bottom:1px solid #30363d;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:max(10px,env(safe-area-inset-top));}
#topbar h1{font-size:15px;font-weight:700;color:#f0f6fc;flex:1;}
#bottomnav{background:#161b22;border-top:1px solid #30363d;display:flex;padding-bottom:max(8px,env(safe-area-inset-bottom));flex-shrink:0;}
.nav-btn{flex:1;padding:8px 4px 6px;background:none;border:none;cursor:pointer;border-top:2px solid transparent;color:#8b949e;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-btn.active{color:#f0f6fc;border-top-color:#1f6feb;}
.nav-btn.my-turn{border-top-color:#10b981;color:#10b981;}
.nav-btn span.icon{font-size:20px;}
.tab-content{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;flex-direction:column;}
.tab-content.active{display:flex;}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;margin-bottom:10px;}
.btn{padding:12px 16px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit;}
.btn-green{background:#238636;color:#fff;}
.btn-blue{background:#1f6feb;color:#fff;}
.btn-gray{background:#21262d;color:#8b949e;}
.btn-red{background:#da3633;color:#fff;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.inp{width:100%;padding:11px 13px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#f0f6fc;font-size:15px;outline:none;font-family:inherit;}
.inp:focus{border-color:#1f6feb;}
label.lbl{display:block;color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;margin-top:14px;}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;}
.badge-GK{background:#f59e0b;color:#000;}
.badge-DEF{background:#3b82f6;color:#fff;}
.badge-MID{background:#10b981;color:#fff;}
.badge-ATT{background:#ef4444;color:#fff;}
.badge-WC{background:#8b5cf6;color:#fff;}
.player-row{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:border-color 0.15s;}
.player-row.tapped{background:#1a2a1a;border-color:#10b981;}
.player-row.grayed{opacity:0.35;pointer-events:none;}
.pname{font-size:15px;font-weight:700;color:#f0f6fc;}
.psub{font-size:12px;color:#8b949e;margin-top:2px;}
.confirm-btns{display:flex;gap:8px;margin-top:10px;}
.confirm-btns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
.cb-yes{background:#238636;color:#fff;}
.cb-no{background:#21262d;color:#8b949e;}
.club-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px;}
.club-btn{background:#161b22;border:2px solid #30363d;border-radius:10px;padding:12px 8px;cursor:pointer;text-align:center;font-family:inherit;}
.club-btn .cdot{width:10px;height:10px;border-radius:50%;margin:0 auto 6px;}
.club-btn .cname{color:#f0f6fc;font-size:12px;font-weight:700;line-height:1.3;}
.club-btn .cavail{color:#484f58;font-size:10px;margin-top:3px;}
.advice-banner{background:linear-gradient(90deg,#1a3a2a,#163020);border-bottom:1px solid #10b981;padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0;}
.pos-filters{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto;flex-shrink:0;}
.pos-btn{padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap;font-family:inherit;}
.roster-slot{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:10px 14px;margin-bottom:5px;}
.roster-slot.filled{border-color:#30363d;background:#161b22;}
.cap-badge{background:#f59e0b;color:#000;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;margin-left:6px;}
.warn{background:#1a1a0a;border:1px solid #f59e0b;border-radius:8px;padding:10px 12px;color:#f59e0b;font-size:13px;margin-bottom:10px;}
.error-msg{background:#1a0a0a;border:1px solid #ef4444;border-radius:8px;padding:10px 12px;color:#ef4444;font-size:13px;margin-bottom:10px;}
.spinner{display:flex;gap:5px;justify-content:center;padding:20px;}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:dp 1.2s ease-in-out infinite;}
@keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;}
.stat-card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;text-align:center;}
.stat-card .sv{font-size:22px;font-weight:700;color:#10b981;}
.stat-card .sl{font-size:11px;color:#8b949e;margin-top:3px;}
.sec-hdr{color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{color:#8b949e;font-size:11px;text-transform:uppercase;padding:6px 8px;text-align:left;border-bottom:1px solid #30363d;}
.tbl td{padding:8px;border-bottom:1px solid #21262d;color:#f0f6fc;}
.tbl tr:last-child td{border-bottom:none;}
.chart-wrap{position:relative;height:220px;margin-bottom:10px;}
.cap-timer{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:700;}
.cap-timer.green{background:#1a3a2a;color:#10b981;}
.cap-timer.amber{background:#3a2a0a;color:#f59e0b;}
.cap-timer.red{background:#3a0a0a;color:#ef4444;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;}
.modal{background:#161b22;border-radius:16px 16px 0 0;padding:20px;width:100%;max-height:80vh;overflow-y:auto;border-top:1px solid #30363d;}
.modal h3{font-size:17px;margin-bottom:14px;}
.club-tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;margin:2px;}
@media(min-width:600px){
  .club-grid{grid-template-columns:repeat(3,1fr);}
  .stat-grid{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>
<div id="app">
  <div id="setup-screen" class="screen active">
    <div style="flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="background:#161b22;border:1px solid #30363d;border-radius:16px;padding:28px;width:100%;max-width:440px;">
        <div style="text-align:center;margin-bottom:24px;">
          <div style="font-size:48px;">&#x26BD;</div>
          <h1 style="font-size:24px;margin:8px 0 4px;">Draft Advisor</h1>
          <p style="color:#8b949e;font-size:13px;margin:0;">Premier League Fantasy &bull; Snake Draft</p>
        </div>
        <label class="lbl">Anthropic API Key</label>
        <input class="inp" id="setup-apikey" type="password" placeholder="sk-ant-api03-...">
        <div id="debug-out" style="margin-top:8px;padding:10px;background:#1c2128;border-radius:8px;color:#10b981;font-size:12px;font-family:monospace;display:none;"></div>
        <label class="lbl">Your Name</label>
        <input class="inp" id="setup-myname" placeholder="e.g. Alex">
        <label class="lbl">Draft Order &mdash; one name per line, first pick at top</label>
        <textarea class="inp" id="setup-order" rows="7" style="resize:vertical;font-family:monospace;font-size:13px;" placeholder="Alex&#10;Tom&#10;Sarah&#10;James&#10;Lucy&#10;Mike"></textarea>
        <label class="lbl">Max players per club</label>
        <select class="inp" id="setup-clubmax">
          <option value="2">2 players max per club</option>
          <option value="3">3 players max per club</option>
        </select>
        <button class="btn btn-blue" style="margin-top:16px;font-size:16px;padding:16px;" onclick="handleSetupClick()">Load Players &amp; Start Draft &rarr;</button>
        <p style="color:#484f58;font-size:12px;text-align:center;margin-top:10px;">Season scoring uses the free FPL API &mdash; no extra cost.</p>
      </div>
    </div>
  </div>
  <div id="welcome-screen" class="screen">
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;">
      <!-- Background gradient art -->
      <div style="position:absolute;inset:0;background:linear-gradient(160deg,#0d1117 0%,#0f2027 40%,#1a0a2e 70%,#0d1117 100%);z-index:0;"></div>
      <!-- Animated orbs for atmosphere -->
      <div style="position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,0.15) 0%,transparent 70%);top:-80px;right:-80px;z-index:0;animation:orb1 6s ease-in-out infinite;"></div>
      <div style="position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,0.12) 0%,transparent 70%);bottom:100px;left:-60px;z-index:0;animation:orb2 8s ease-in-out infinite;"></div>
      <div style="position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.1) 0%,transparent 70%);top:200px;right:20px;z-index:0;animation:orb1 5s ease-in-out infinite reverse;"></div>
      <!-- Content -->
      <div style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 24px;text-align:center;">
        <!-- Badge -->
        <div style="font-size:64px;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(16,185,129,0.6));">&#x26BD;</div>
        <div style="font-size:11px;letter-spacing:3px;color:#10b981;text-transform:uppercase;margin-bottom:12px;font-weight:700;">Fantasy Draft</div>
        <h1 style="font-size:36px;font-weight:900;color:#f0f6fc;margin:0 0 6px;letter-spacing:-1px;line-height:1.1;">Draft<br><span style="color:#10b981;">Advisor</span></h1>
        <p style="color:#8b949e;font-size:14px;margin:0 0 40px;max-width:280px;line-height:1.6;" id="welcome-subtitle">Premier League Fantasy &bull; Snake Draft</p>
        <!-- Action buttons -->
        <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;" id="welcome-buttons"></div>
      </div>
      <!-- Bottom info -->
      <div style="position:relative;z-index:1;padding:16px;text-align:center;flex-shrink:0;">
        <div style="color:#484f58;font-size:11px;" id="welcome-footer"></div>
      </div>
    </div>
  </div>
  <div id="loading-screen" class="screen">
    <div style="flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="background:#161b22;border:1px solid #30363d;border-radius:16px;padding:28px;width:100%;max-width:440px;text-align:center;">
        <div style="font-size:44px;margin-bottom:12px;">&#x26BD;</div>
        <h2 style="margin-bottom:6px;" id="load-title">Loading Player Pool&hellip;</h2>
        <p style="color:#8b949e;font-size:13px;margin-bottom:16px;" id="load-subtitle">Starting&hellip;</p>
        <div style="background:#0d1117;border-radius:8px;height:10px;overflow:hidden;margin-bottom:8px;">
          <div id="load-bar" style="width:0%;height:100%;background:linear-gradient(90deg,#10b981,#059669);transition:width 0.3s;border-radius:8px;"></div>
        </div>
        <p style="color:#484f58;font-size:12px;margin-bottom:14px;" id="load-pct">0%</p>
        <div id="load-clubs" style="display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-bottom:10px;"></div>
        <div id="load-total" style="color:#484f58;font-size:12px;margin-bottom:6px;"></div>
        <div id="load-errors"></div>
      </div>
    </div>
  </div>
  <div id="main-screen" class="screen">
    <div id="topbar">
      <h1 id="topbar-title">Draft Advisor</h1>
      <div id="topbar-info" style="color:#8b949e;font-size:12px;"></div>
      <button id="undo-btn" class="btn btn-gray" style="width:auto;padding:7px 12px;font-size:13px;display:none;" onclick="undoPick()">&#x21A9; Undo</button>
    </div>
    <div id="advice-banner" class="advice-banner" style="display:none;" onclick="showTab('advice')">
      <div class="dot" style="width:8px;height:8px;flex-shrink:0;"></div>
      <span style="color:#10b981;font-weight:700;font-size:14px;">&#x1F916; Your turn! Tap for recommendation</span>
      <span style="margin-left:auto;color:#10b981;">&#x203A;</span>
    </div>
    <div id="captain-banner" style="display:none;background:#3a1a0a;border-bottom:1px solid #f59e0b;padding:10px 16px;cursor:pointer;flex-shrink:0;" onclick="showTab('myteam')">
      <span style="color:#f59e0b;font-weight:700;font-size:13px;" id="captain-banner-text"></span>
    </div>
    <div id="tab-draft" class="tab-content"></div>
    <div id="tab-myteam" class="tab-content"></div>
    <div id="tab-friends" class="tab-content"></div>
    <div id="tab-league" class="tab-content"></div>
    <div id="tab-advice" class="tab-content"></div>
    <div id="tab-settings" class="tab-content"></div>
    <div id="tab-pool" class="tab-content"></div>
    <div id="bottomnav">
      <button class="nav-btn" data-tab="draft" onclick="showTab('draft')"><span class="icon">&#x1F3DF;</span><span>Draft</span></button>
      <button class="nav-btn" data-tab="myteam" onclick="showTab('myteam')"><span class="icon">&#x1F464;</span><span>My Team</span></button>
      <button class="nav-btn" data-tab="friends" onclick="showTab('friends')"><span class="icon">&#x1F465;</span><span>Friends</span></button>
      <button class="nav-btn" data-tab="league" onclick="showTab('league')"><span class="icon">&#x1F4CA;</span><span>League</span></button>
      <button class="nav-btn" data-tab="advice" onclick="showTab('advice')"><span class="icon">&#x1F916;</span><span>Advice</span></button>
      <button class="nav-btn" data-tab="pool" onclick="showTab('pool')" style="display:none;"><span class="icon">&#x1F30D;</span><span>Pool</span></button>
      <button class="nav-btn" data-tab="settings" onclick="showTab('settings')"><span class="icon">&#x2699;</span><span>Settings</span></button>
    </div>
  </div>
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal" id="modal-content"></div>
  </div>
</div>
<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const DB = "da_";
const SLOTS = {GK:2,DEF:5,MID:5,ATT:3,WC:2};
const TOTAL_PICKS = 17;
const CHART_COLORS = ["#10b981","#3b82f6","#f59e0b","#ef4444","#8b5cf6","#ec4899","#06b6d4","#84cc16","#f97316","#a855f7","#14b8a6","#eab308"];
const POS_COLORS = {GK:{bg:"#f59e0b",text:"#000"},DEF:{bg:"#3b82f6",text:"#fff"},MID:{bg:"#10b981",text:"#fff"},ATT:{bg:"#ef4444",text:"#fff"},WC:{bg:"#8b5cf6",text:"#fff"}};
const CLUB_COLORS = {
  "Arsenal":"#EF0107","Aston Villa":"#670E36","Bournemouth":"#B50E12","Brentford":"#FF2014",
  "Brighton":"#0057B8","Burnley":"#6C1D45","Chelsea":"#034694","Crystal Palace":"#C4122E",
  "Everton":"#274488","Fulham":"#aaaaaa","Ipswich Town":"#3A64A3","Leeds United":"#FFCD00",
  "Leicester City":"#003090","Liverpool":"#C8102E","Manchester City":"#6CABDD",
  "Manchester United":"#DA291C","Newcastle United":"#41B4D2","Nottingham Forest":"#DD0000",
  "Southampton":"#D71920","Sunderland":"#EB172B","Tottenham Hotspur":"#132257",
  "West Ham United":"#7A263A","Wolverhampton Wanderers":"#FDB913","Luton Town":"#F78F1E",
  "Sheffield United":"#EE2737","Middlesbrough":"#E31B23","Coventry City":"#84B0D8",
  "Norwich City":"#00A650","Derby County":"#1D2C5E","Preston North End":"#FFFFFF"
};
let PL_CLUBS = [];

// ── STATE ──────────────────────────────────────────────────────────────────────
let S = {
  apiKey:"", myName:"", draftOrder:[], clubMax:2,
  playerPool:[], pickedMap:{}, teams:{}, snakeOrder:[], pickIdx:0,
  draftDone:false, hideDraft:false, captains:{}, wildcardSubs:{},
  scores:{}, lastRefreshed:null, currentGW:1, history:[],
  advice:null, adviceLoading:false, defaultTab:"myteam"
};

// ── PERSISTENCE ────────────────────────────────────────────────────────────────
function sv(k,v){try{localStorage.setItem(DB+k,JSON.stringify(v));}catch(e){}}
function ld(k,d){try{var v=localStorage.getItem(DB+k);return v!==null?JSON.parse(v):d;}catch(e){return d;}}
function saveAll(){
  sv("cfg",{apiKey:S.apiKey,myName:S.myName,draftOrder:S.draftOrder,clubMax:S.clubMax,defaultTab:S.defaultTab,hideDraft:S.hideDraft,draftDone:S.draftDone});
  sv("pool",S.playerPool); sv("picked",S.pickedMap); sv("teams",S.teams);
  sv("snake",{snakeOrder:S.snakeOrder,pickIdx:S.pickIdx});
  sv("captains",S.captains); sv("wildcards",S.wildcardSubs);
  sv("scores",S.scores); sv("meta",{lastRefreshed:S.lastRefreshed,currentGW:S.currentGW});
  sv("clubs",PL_CLUBS);
}
function loadAll(){
  var c=ld("cfg",{});
  S.apiKey=c.apiKey||""; S.myName=c.myName||""; S.draftOrder=c.draftOrder||[];
  S.clubMax=c.clubMax||2; S.defaultTab=c.defaultTab||"myteam";
  S.hideDraft=c.hideDraft||false; S.draftDone=c.draftDone||false;
  S.playerPool=ld("pool",[]); S.pickedMap=ld("picked",{}); S.teams=ld("teams",{});
  var sn=ld("snake",{}); S.snakeOrder=sn.snakeOrder||[]; S.pickIdx=sn.pickIdx||0;
  S.captains=ld("captains",{}); S.wildcardSubs=ld("wildcards",{});
  S.scores=ld("scores",{}); var m=ld("meta",{});
  S.lastRefreshed=m.lastRefreshed||null; S.currentGW=m.currentGW||1;
  var savedClubs=ld("clubs",[]);
  if(savedClubs.length>0) PL_CLUBS=savedClubs;
}

// ── HELPERS ────────────────────────────────────────────────────────────────────
function buildSnake(players,rounds){
  var o=[];
  for(var r=0;r<rounds;r++){
    var row=r%2===0?[].concat(players):players.slice().reverse();
    row.forEach(function(p){o.push(p);});
  }
  return o;
}
function initTeams(){
  S.draftOrder.forEach(function(n){if(!S.teams[n])S.teams[n]={GK:[],DEF:[],MID:[],ATT:[],WC:[]};});
}
function getClubColor(c){return CLUB_COLORS[c]||"#6b7280";}
function currentPicker(){return S.snakeOrder[S.pickIdx]||null;}
function isMyTurn(){return currentPicker()===S.myName;}
function draftComplete(){return S.pickIdx>=S.snakeOrder.length;}
function available(){return S.playerPool.filter(function(p){return !S.pickedMap[p.name+"|"+p.club];});}
function clubCountForPicker(name,club){
  var t=S.teams[name]||{},c=0;
  ["GK","DEF","MID","ATT"].forEach(function(pos){(t[pos]||[]).forEach(function(p){if(p.club===club)c++;});});
  return c;
}
function isClubBlocked(name,club){return clubCountForPicker(name,club)>=S.clubMax;}

function extractJSON(raw){
  if(!raw) throw new Error("Empty response");
  var a0=raw.indexOf("["),a1=raw.lastIndexOf("]");
  if(a0!==-1&&a1>a0){try{return JSON.parse(raw.slice(a0,a1+1));}catch(e){}}
  var o0=raw.indexOf("{"),o1=raw.lastIndexOf("}");
  if(o0!==-1&&o1>o0){try{return JSON.parse(raw.slice(o0,o1+1));}catch(e){}}
  throw new Error("No JSON found in response");
}
function normalise(p,club){
  var pm={FWD:"ATT",FOR:"ATT",STR:"ATT",FORWARD:"ATT",MIDFIELDER:"MID",DEFENDER:"DEF",GKP:"GK",GOALKEEPER:"GK"};
  var raw=((p.position||p.pos||"MID")+"").toUpperCase().trim();
  var pos=pm[raw]||raw;
  return {
    name:((p.name||p.player||"Unknown")+"").trim(),
    club:club,
    position:["GK","DEF","MID","ATT"].includes(pos)?pos:"MID",
    fplPrice:parseFloat(p.fplPrice||p.price||p.cost||0)||0,
    lastSeasonPts:parseInt(p.lastSeasonPts||p.points||p.pts||0)||0,
    rating:parseFloat(p.rating||p.score||5)||5,
    fplId:p.fplId||p.id||null
  };
}

// ── API CALL ───────────────────────────────────────────────────────────────────
async function callClaude(system,userMsg,maxTokens){
  maxTokens=maxTokens||1500;
  if(!S.apiKey) throw new Error("No API key set");
  var r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:maxTokens,system:system,messages:[{role:"user",content:userMsg}]})
  });
  var d=await r.json();
  if(d.error) throw new Error(d.error.type+": "+d.error.message);
  var text=(d.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
  if(!text) throw new Error("Empty response from API");
  return text;
}

function setLoadUI(pct,subtitle,clubCounts,errors,total,failed){
  document.getElementById("load-bar").style.width=pct+"%";
  document.getElementById("load-pct").textContent=pct+"%";
  document.getElementById("load-subtitle").textContent=subtitle;
  document.getElementById("load-total").textContent=total>0?(total+" players loaded"):"";
  if(PL_CLUBS.length>0){
    document.getElementById("load-clubs").innerHTML=PL_CLUBS.map(function(c){
      var cnt=clubCounts[c];
      var done=cnt!==undefined;
      var fail=done&&cnt===0;
      var bg=done?(fail?"#3a1a1a":"#1a3a2a"):"#1c2128";
      var col=done?(fail?"#ef4444":"#10b981"):"#484f58";
      var bdr=done?(fail?"#ef4444":"#238636"):"#30363d";
      var lbl=done?(fail?("! "+c):(c+" ("+cnt+")")):(c);
      return '<span class="club-tag" style="background:'+bg+';color:'+col+';border:1px solid '+bdr+';">'+lbl+'</span>';
    }).join("");
  }
  var errEl=document.getElementById("load-errors");
  if(failed&&failed.length>0){
    errEl.innerHTML='<div class="error-msg">Failed: '+failed.join(", ")+'</div>'+
      '<button class="btn btn-blue" style="margin-bottom:6px;" onclick="retryClubs('+JSON.stringify(failed)+')">Retry Failed Clubs</button>'+
      '<button class="btn btn-gray" onclick="proceedToApp()">Continue Without These</button>';
  } else if(errors&&errors.length>0){
    errEl.innerHTML='<div class="warn">'+errors.slice(0,3).join("<br>")+'</div>';
  } else {
    errEl.innerHTML="";
  }
}

async function fetchPLClubs(){
  var sys="You are a football expert. Return ONLY a JSON array of exactly 20 strings: the 20 Premier League club names for the next upcoming season (2026-27). Account for promotions and relegations from 2025-26. Return raw JSON array only, starting with [.";
  try{
    var raw=await callClaude(sys,"Which 20 clubs are in the Premier League for 2026-27? JSON array of names only.",300);
    var arr=extractJSON(raw);
    if(Array.isArray(arr)&&arr.length>=18) return arr;
    throw new Error("Wrong count: "+arr.length);
  }catch(e){
    console.warn("fetchPLClubs failed:",e.message);
    return ["Arsenal","Aston Villa","Bournemouth","Brentford","Brighton","Chelsea","Crystal Palace","Everton","Fulham","Leeds United","Liverpool","Manchester City","Manchester United","Newcastle United","Nottingham Forest","Sunderland","Tottenham Hotspur","West Ham United","Wolverhampton Wanderers","Burnley"];
  }
}

async function loadAllPlayers(){
  var pool=[];
  // Test API key
  try{
    await callClaude("Reply with the single word: ok","ok",10);
  }catch(e){
    document.getElementById("load-title").textContent="API Error";
    document.getElementById("load-subtitle").textContent="Could not connect to Claude API";
    document.getElementById("load-errors").innerHTML='<div class="error-msg" style="padding:14px;"><strong>Error:</strong><br><br>'+e.message+'<br><br>Common causes:<br>&#x2022; API key incorrect<br>&#x2022; No billing credit<br>&#x2022; Network issue</div><button class="btn btn-gray" style="margin-top:10px;" onclick="showScreen(\'setup\')">&#x2190; Go Back</button>';
    return [];
  }

  // Get clubs
  setLoadUI(5,"Finding Premier League clubs for 2026-27 season...",{},null,0,null);
  PL_CLUBS=await fetchPLClubs();
  setLoadUI(10,"Loading "+PL_CLUBS.length+" clubs in batches...",{},null,0,null);

  var clubCounts={}, errors=[], batchSize=4;
  var batches=[];
  for(var i=0;i<PL_CLUBS.length;i+=batchSize) batches.push(PL_CLUBS.slice(i,i+batchSize));

  for(var b=0;b<batches.length;b++){
    var batch=batches[b];
    var pct=Math.round(10+((b/batches.length)*75));
    setLoadUI(pct,"Loading batch "+(b+1)+"/"+batches.length+": "+batch.join(", "),clubCounts,errors,pool.length,null);

    var sys="You are a Premier League fantasy football expert. Return a JSON object where keys are club names and values are arrays of players. Include ALL first-team players for EACH of these clubs for the 2026-27 Premier League season including summer 2025 transfers. Each player object must have: name (string), position (GK/DEF/MID/ATT), fplPrice (number in pounds), lastSeasonPts (integer), rating (1-10 integer). Aim for 20-25 players per club. Return raw JSON object only, starting with {.";
    var userMsg="Return squads for these Premier League clubs: "+batch.join(", ");

    try{
      var raw=await callClaude(sys,userMsg,6000);
      var parsed=extractJSON(raw);
      if(parsed&&typeof parsed==="object"&&!Array.isArray(parsed)){
        batch.forEach(function(club){
          var players=parsed[club]||parsed[club.toLowerCase()]||null;
          if(!players){
            // Try partial match
            Object.keys(parsed).forEach(function(k){
              if(k.toLowerCase().includes(club.toLowerCase().split(" ")[0])) players=parsed[k];
            });
          }
          if(Array.isArray(players)&&players.length>=3){
            var normed=players.map(function(p){return normalise(p,club);});
            clubCounts[club]=normed.length;
            pool=pool.concat(normed);
          } else {
            clubCounts[club]=0;
            errors.push(club+": not found in batch response");
          }
        });
      } else {
        batch.forEach(function(club){clubCounts[club]=0;errors.push(club+": batch parse failed");});
      }
    }catch(e){
      batch.forEach(function(club){clubCounts[club]=0;errors.push(club+": "+e.message);});
    }
    setLoadUI(pct+5,"Batch "+(b+1)+" done",clubCounts,errors,pool.length,null);
  }

  // Retry individual failed clubs
  var failed=PL_CLUBS.filter(function(c){return (clubCounts[c]||0)===0;});
  if(failed.length>0){
    setLoadUI(88,"Retrying "+failed.length+" failed clubs...",clubCounts,errors,pool.length,null);
    for(var fi=0;fi<failed.length;fi++){
      var club=failed[fi];
      var sys2="Return ALL first-team players for "+club+" in the 2026-27 Premier League season as a JSON array. Each player: name, position (GK/DEF/MID/ATT), fplPrice, lastSeasonPts, rating. About 20-25 players. Raw JSON array starting with [.";
      try{
        var raw2=await callClaude(sys2,club+" squad.",2000);
        var players2=extractJSON(raw2);
        if(Array.isArray(players2)&&players2.length>=3){
          var normed2=players2.map(function(p){return normalise(p,club);});
          pool=pool.concat(normed2);
          clubCounts[club]=normed2.length;
          errors=errors.filter(function(e){return !e.startsWith(club);});
        }
      }catch(e2){console.warn("Retry failed for "+club+":",e2.message);}
      setLoadUI(88,"Retried: "+club,clubCounts,errors,pool.length,null);
    }
  }

  // Dedupe and sort
  var seen=new Set();
  pool=pool.filter(function(p){
    var k=(p.name+"|"+p.club).toLowerCase();
    if(seen.has(k)) return false;
    seen.add(k); return true;
  }).sort(function(a,b){return b.rating-a.rating;});

  S.playerPool=pool;
  sv("pool",pool); sv("clubs",PL_CLUBS);

  var stillFailed=PL_CLUBS.filter(function(c){return (clubCounts[c]||0)===0;});
  setLoadUI(100,"Complete! "+pool.length+" players loaded.",clubCounts,errors,pool.length,stillFailed.length>0?stillFailed:null);
  return pool;
}

async function retryClubs(clubs){
  document.getElementById("load-errors").innerHTML="<div class='warn'>Retrying...</div>";
  var pool=S.playerPool.slice();
  for(var i=0;i<clubs.length;i++){
    var club=clubs[i];
    var sys="Return ALL first-team players for "+club+" in the 2026-27 Premier League season as a JSON array. Each player: name, position (GK/DEF/MID/ATT), fplPrice, lastSeasonPts, rating. About 20-25 players. Raw JSON array starting with [.";
    try{
      var raw=await callClaude(sys,club+" squad.",2000);
      var players=extractJSON(raw);
      if(Array.isArray(players)&&players.length>=3){
        pool=pool.filter(function(p){return p.club!==club;});
        pool=pool.concat(players.map(function(p){return normalise(p,club);}));
      }
    }catch(e){console.warn(club+" retry failed:",e);}
  }
  var seen=new Set();
  pool=pool.filter(function(p){var k=(p.name+"|"+p.club).toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
  S.playerPool=pool; sv("pool",pool);
  document.getElementById("load-errors").innerHTML="<div class='warn'>Retry complete. "+pool.length+" players loaded.</div>";
  setTimeout(proceedToApp,1000);
}

// ── FPL SCORE REFRESH ──────────────────────────────────────────────────────────
async function refreshScores(){
  try{
    var sys = 'Premier League fantasy football data assistant. Today: ' + new Date().toDateString() + '. Fetch https://fantasy.premierleague.com/api/bootstrap-static/ and return JSON with currentGW (integer, the current active gameweek id) and players (array of objects with id, web_name, total_points). Raw JSON only starting with {.';
    var raw = await callClaude(sys, 'Fetch FPL bootstrap-static and return current gameweek and all player points as JSON.', 4000);
    var d = extractJSON(raw);
    if(!d || !d.currentGW) throw new Error('Could not get current gameweek');
    var gw = parseInt(d.currentGW);
    S.currentGW = gw;

    var nameToId = {};
    (d.players||[]).forEach(function(p){
      if(p.web_name) nameToId[p.web_name.toLowerCase()] = p.id;
    });

    var needed = [];
    for(var g = 1; g <= gw; g++){ if(!S.scores[g]) needed.push(g); }
    if(needed.length === 0){
      S.lastRefreshed = new Date().toISOString();
      sv('meta', {lastRefreshed: S.lastRefreshed, currentGW: S.currentGW});
      return true;
    }

    var sys2 = 'Premier League fantasy football data assistant. For each gameweek number in the list, fetch https://fantasy.premierleague.com/api/event/[GW]/live/ substituting [GW] with the number. Return a JSON object where keys are gameweek numbers as strings and values are objects mapping each player web_name to their total_points integer for that gameweek. Raw JSON only starting with {.';
    var raw2 = await callClaude(sys2, 'Fetch FPL live scores for gameweeks: ' + needed.join(', ') + '. Return as JSON.', 4000);
    var gwData = extractJSON(raw2);

    needed.forEach(function(g){
      var gwScores = gwData[g] || gwData[String(g)] || {};
      var mapped = {};
      getAllPlayers().forEach(function(p){
        var nl = p.name.toLowerCase();
        var pts = gwScores[p.name] || gwScores[nl] || gwScores[p.name.split(' ').pop()] || 0;
        mapped[p.name + '|' + p.club] = parseInt(pts) || 0;
      });
      S.scores[g] = mapped;
    });

    S.lastRefreshed = new Date().toISOString();
    sv('scores', S.scores);
    sv('meta', {lastRefreshed: S.lastRefreshed, currentGW: S.currentGW});
    return true;
  }catch(e){
    console.error('Score refresh failed:', e);
    return false;
  }
}

function getAllPlayers(){
  var all=[];
  S.draftOrder.forEach(function(n){
    var t=S.teams[n]||{};
    ["GK","DEF","MID","ATT","WC"].forEach(function(pos){(t[pos]||[]).forEach(function(p){all.push(p);});});
  });
  return all;
}
function getPlayerPts(key,ownerName,upToGW){
  var cap=S.captains[ownerName];
  var isCap=cap&&(cap.player.name+"|"+cap.player.club)===key;
  var sub=(S.wildcardSubs[ownerName]||[]).find(function(s){return (s.outPlayer.name+"|"+s.outPlayer.club)===key;});
  var subGW=sub?sub.gameweek:null;
  var total=0;
  var maxGW=upToGW||S.currentGW;
  for(var g=1;g<=maxGW;g++){
    if(subGW&&g>=subGW) continue;
    var pts=(S.scores[g]||{})[key]||0;
    total+=isCap?pts*2:pts;
  }
  return total;
}
function getPersonTotalPts(name,upToGW){
  var t=S.teams[name]||{},total=0;
  ["GK","DEF","MID","ATT","WC"].forEach(function(pos){
    (t[pos]||[]).forEach(function(p){total+=getPlayerPts(p.name+"|"+p.club,name,upToGW);});
  });
  return total;
}
function getPersonGWPts(name,gw){
  var t=S.teams[name]||{},cap=S.captains[name],total=0,gwS=S.scores[gw]||{};
  ["GK","DEF","MID","ATT","WC"].forEach(function(pos){
    (t[pos]||[]).forEach(function(p){
      var key=p.name+"|"+p.club;
      var sub=(S.wildcardSubs[name]||[]).find(function(s){return (s.outPlayer.name+"|"+s.outPlayer.club)===key;});
      if(sub&&gw>=sub.gameweek) return;
      var pts=gwS[key]||0;
      var isCap=cap&&(cap.player.name+"|"+cap.player.club)===key;
      total+=isCap?pts*2:pts;
    });
  });
  return total;
}

function capDaysLeft(name){
  var cap=S.captains[name];
  if(!cap) return null;
  var set=new Date(cap.dateSet),exp=new Date(set);
  exp.setMonth(exp.getMonth()+3);
  return Math.ceil((exp-new Date())/(1000*60*60*24));
}
function capTimerHtml(name){
  var d=capDaysLeft(name);
  if(d===null) return "";
  var cls=d<=0?"red":d<=7?"amber":"green";
  return '<span class="cap-timer '+cls+'">'+(d<=0?"EXPIRED":d+"d left")+'</span>';
}

  var myTeam=S.teams[S.myName]||{};
  var slotsLeft={};
  Object.keys(SLOTS).forEach(function(pos){slotsLeft[pos]=SLOTS[pos]-(myTeam[pos]||[]).length;});
  var totalLeft=Object.values(slotsLeft).reduce(function(a,b){return a+b;},0);
  var topGKs=avail.filter(function(p){return p.position==="GK"&&p.rating>=7;}).length;
  var upcoming=S.snakeOrder.slice(S.pickIdx+1);
  var nextTurn=upcoming.findIndex(function(n){return n===S.myName;});
  var blockedClubs=[];
  Object.keys(SLOTS).forEach(function(pos){
    if(pos==="WC") return;
    (myTeam[pos]||[]).forEach(function(p){
      if(clubCountForPicker(S.myName,p.club)>=S.clubMax&&!blockedClubs.includes(p.club)) blockedClubs.push(p.club);
    });
  });
  var sys="You are an elite Premier League fantasy draft strategist.\nMY TEAM: "+JSON.stringify(myTeam)+"\nSLOTS NEEDED: "+JSON.stringify(slotsLeft)+" ("+totalLeft+" picks left)\nPICKS UNTIL MY NEXT TURN: "+(nextTurn<0?"last pick":nextTurn)+"\nTOP GKs AVAILABLE (rated 7+): "+topGKs+"\nCLUBS AT LIMIT (cannot pick from): "+blockedClubs.join(",")+"\nMAX PER CLUB: "+S.clubMax+"\nTOP 60 AVAILABLE: "+JSON.stringify(avail.slice(0,60).map(function(p){return {n:p.name,c:p.club,pos:p.position,price:p.fplPrice,pts:p.lastSeasonPts,r:p.rating};}))+"\nNEXT 20 PICKS: "+S.snakeOrder.slice(S.pickIdx,S.pickIdx+20).join(", ")+"\nReturn JSON only: {\"pick\":{\"name\":\"\",\"club\":\"\",\"position\":\"\",\"fplPrice\":0,\"lastSeasonPts\":0,\"rating\":0},\"reason\":\"2-3 sentences\",\"scarcity\":\"one line or empty\",\"nextTarget\":\"brief note\"}";
  try{
    var raw=await callClaude(sys,"Recommend my next draft pick.",500);

  }catch(e){
    S.advice={pick:avail[0]||null,reason:"Could not generate recommendation. Pick the highest rated available player for your most needed position.",scarcity:"",nextTarget:""};

function tapPlayer(name,club){
  var p=available().find(function(p){return p.name===name&&p.club===club;});
  if(!p) return;
  tappedPlayer=(tappedPlayer&&tappedPlayer.name===name&&tappedPlayer.club===club)?null:p;
  renderClubPlayers(document.getElementById("tab-draft"));
}

function doConfirmPick(){
  if(!tappedPlayer) return;
  var picker=currentPicker();
  if(tappedPlayer.position!=="WC"&&isClubBlocked(picker,tappedPlayer.club)){
    showToast("Cannot pick - "+picker+" already has "+S.clubMax+" from "+tappedPlayer.club);
    tappedPlayer=null; renderDraftTab(); return;
  }
  confirmPick(tappedPlayer,picker);
  tappedPlayer=null; selectedClub=null;
  showTab(isMyTurn()&&!S.draftDone?"advice":"draft");
}

function openWildcardModal(){
  var picker=currentPicker();

// ── CAPTAIN MODAL ──────────────────────────────────────────────────────────────
function openCaptainModal(personName){
  var team=S.teams[personName]||{};
  var existing=S.captains[personName];
  var myPicks=Object.entries(S.pickedMap).filter(function(e){return e[1]===personName;}).map(function(e){return e[0];});
  var firstPickKey=myPicks[0]||null;
  var html='<h3>Nominate Captain for '+personName+'</h3><p style="color:#8b949e;font-size:13px;margin-bottom:14px;">Cannot be their first pick. Points doubled for up to 3 months.</p>';
  ["GK","DEF","MID","ATT"].forEach(function(pos){
    (team[pos]||[]).forEach(function(p){
      var key=p.name+"|"+p.club;
      if(key===firstPickKey) return;
      var isCur=existing&&(existing.player.name+"|"+existing.player.club)===key;
      html+='<div class="player-row'+(isCur?" tapped":"")+'" onclick="setCaptain(\''+personName.replace(/'/g,"\\'")+'\',\''+p.name.replace(/'/g,"\\'")+'\',\''+p.club.replace(/'/g,"\\'")+'\')"><div style="display:flex;align-items:center;gap:10px;"><span class="badge badge-'+p.position+'">'+p.position+'</span><div style="flex:1;"><div class="pname">'+p.name+(isCur?' <span class="cap-badge">Current C</span>':"")+' <span style="font-size:10px;color:#484f58;font-weight:normal;">'+(p.pickNumber?"#"+p.pickNumber:"")+"</span></div><div class='psub'>"+p.club+"</div></div></div></div>";
    });
  });
  showModal(html);
}
function setCaptain(personName,pName,pClub){
  var team=S.teams[personName]||{},player=null;
  ["GK","DEF","MID","ATT"].forEach(function(pos){(team[pos]||[]).forEach(function(p){if(p.name===pName&&p.club===pClub)player=p;});});
  if(!player) return;
  S.captains[personName]={player:player,dateSet:new Date().toISOString()};
  sv("captains",S.captains);
  closeModal(); checkCaptainBanner();
  renderMyTeamTab(); renderFriendsTab();
}

// ── WILDCARD SUB ───────────────────────────────────────────────────────────────
function openSubModal(personName,wcIdx){
  var team=S.teams[personName]||{};
  var wcPlayer=(team.WC||[])[wcIdx];
  if(!wcPlayer) return;
  var html='<h3>Sub In '+wcPlayer.name+'</h3><p style="color:#8b949e;font-size:13px;margin-bottom:14px;">Select a player to permanently replace. They will stop scoring from now.</p>';
  ["GK","DEF","MID","ATT"].forEach(function(pos){
    (team[pos]||[]).forEach(function(p,i){
      var key=p.name+"|"+p.club;
      var gone=(S.wildcardSubs[personName]||[]).find(function(s){return (s.outPlayer.name+"|"+s.outPlayer.club)===key;});
      if(gone) return;
      html+='<div class="player-row" onclick="confirmSub(\''+personName.replace(/'/g,"\\'")+'\','+wcIdx+',\''+p.name.replace(/'/g,"\\'")+'\',\''+p.club.replace(/'/g,"\\'")+'\',\''+pos+'\','+i+')"><div style="display:flex;align-items:center;gap:10px;"><span class="badge badge-'+p.position+'">'+p.position+'</span><div style="flex:1;"><div class="pname">'+p.name+'</div><div class="psub">'+p.club+"</div></div></div></div>";
    });
  });
  showModal(html);
}
function confirmSub(personName,wcIdx,outName,outClub,outPos,outIdx){
  var team=S.teams[personName]||{};
  var wcPlayer=(team.WC||[])[wcIdx];
  var outPlayer=(team[outPos]||[])[outIdx];
  if(!wcPlayer||!outPlayer){closeModal();return;}
  if(!S.wildcardSubs[personName]) S.wildcardSubs[personName]=[];
  S.wildcardSubs[personName].push({inPlayer:wcPlayer,outPlayer:outPlayer,gameweek:S.currentGW,wcIdx:wcIdx,outPos:outPos,outIdx:outIdx});
  sv("wildcards",S.wildcardSubs);
  closeModal(); renderMyTeamTab();
  if(viewingFriend===personName) renderFriendDetail(document.getElementById("tab-friends"),personName);
}
function resolveWildcard(personName,wcIdx){
  showModal('<h3>Resolve Wildcard</h3><p style="color:#8b949e;font-size:13px;margin-bottom:14px;">This player is now at a PL club. Select their club to link FPL scoring.</p><label class="lbl">Premier League Club</label><select class="inp" id="resolve-club" style="margin-bottom:14px;">'+PL_CLUBS.map(function(c){return '<option>'+c+'</option>';}).join("")+'</select><button class="btn btn-blue" onclick="doResolveWildcard(\''+personName.replace(/'/g,"\\'")+'\','+wcIdx+')">Resolve</button>');
}
function doResolveWildcard(personName,wcIdx){
  var club=document.getElementById("resolve-club").value;
  var team=S.teams[personName];
  if(!team||!team.WC[wcIdx]) return;
  team.WC[wcIdx].club=club; team.WC[wcIdx].isNonPL=false;
  sv("teams",S.teams); closeModal(); renderMyTeamTab();
}

    el.innerHTML='<div style="padding:40px;text-align:center;"><div class="spinner"><div class="dot"></div><div class="dot" style="animation-delay:0.2s"></div><div class="dot" style="animation-delay:0.4s"></div></div><div style="color:#8b949e;font-size:14px;margin-top:8px;">Analysing the draft...</div></div>';
    return;
  }
  if(!S.advice){el.innerHTML='<div style="padding:40px;text-align:center;color:#8b949e;">Generating recommendation...</div>';return;}
  var p=S.advice.pick;

  if(p){html+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;"><span class="badge badge-'+p.position+'">'+p.position+'</span><div><div style="font-size:18px;font-weight:700;">'+p.name+'</div><div style="color:#8b949e;font-size:13px;">'+p.club+' &middot; &pound;'+p.fplPrice+'m &middot; '+p.lastSeasonPts+'pts</div></div></div>';}
  html+='<div style="color:#e6edf3;font-size:14px;line-height:1.6;margin-bottom:10px;">'+(S.advice.reason||"")+"</div>";
  if(S.advice.scarcity) html+='<div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 12px;color:#ef4444;font-size:13px;margin-bottom:10px;">&#x26A0;&#xFE0F; '+S.advice.scarcity+"</div>";
  if(S.advice.nextTarget) html+='<div style="color:#8b949e;font-size:12px;">&#x1F504; Next: '+S.advice.nextTarget+"</div>";
  html+="</div>";
  if(p){html+='<div style="display:flex;gap:10px;margin-top:12px;"><button class="btn btn-green" style="flex:2;" onclick="acceptAdvice()">&#x2713; Accept Pick</button><button class="btn btn-gray" style="flex:1;" onclick="overrideAdvice()">Override</button></div>';}
  html+="</div>";
  el.innerHTML=html;
}
function acceptAdvice(){
  if(!S.advice||!S.advice.pick) return;
  var p=S.advice.pick;
  var found=S.playerPool.find(function(pl){return pl.name===p.name&&pl.club===p.club;})||S.playerPool.find(function(pl){return pl.name===p.name;});
  if(!found){showToast("Player not found - please pick manually.");overrideAdvice();return;}
  S.advice=null;
  confirmPick(found,S.myName);
  selectedClub=null;
  showTab("draft");
}
function overrideAdvice(){S.advice=null;showTab("draft");}

function confirmAutoFill(){
  showModal('<h3>&#x1F3B2; Auto-Fill Test Data</h3><p style="color:#8b949e;font-size:13px;margin-bottom:16px;">Randomly assigns players to all teams, sets captains, and generates 5 GWs of fake scores.</p><p style="color:#f59e0b;font-size:13px;margin-bottom:16px;">&#x26A0; Overwrites existing draft picks.</p><button class="btn btn-blue" onclick="autoFillDraft()">&#x1F3B2; Fill Test Data</button><button class="btn btn-gray" style="margin-top:8px;" onclick="closeModal()">Cancel</button>');
}
function autoFillDraft(){
  if(S.playerPool.length===0){showToast("Load players first");return;}
  S.pickedMap={}; S.teams={}; S.pickIdx=0; S.draftDone=false; S.hideDraft=false; S.history=[]; S.advice=null;
  initTeams();
  var shuffled=S.playerPool.slice().sort(function(){return Math.random()-0.5;});
  var pi=0;
  for(var i=0;i<S.snakeOrder.length;i++){
    var picker=S.snakeOrder[i],team=S.teams[picker];
    var needs=[];
    Object.entries(SLOTS).forEach(function(e){if((team[e[0]]||[]).length<e[1])needs.push(e[0]);});
    if(needs.length===0) continue;
    var targetPos=needs[0];
    var assigned=false,attempts=0;
    while(pi<shuffled.length*2&&attempts<shuffled.length){
      var p=shuffled[pi%shuffled.length]; pi++; attempts++;
      var key=p.name+"|"+p.club;
      if(S.pickedMap[key]) continue;
      if(targetPos!=="WC"&&p.position!==targetPos) continue;
      if(targetPos!=="WC"&&isClubBlocked(picker,p.club)) continue;
      S.pickedMap[key]=picker;
      team[targetPos].push(Object.assign({},p,{pickNumber:i+1}));
      assigned=true; break;
    }
    if(!assigned){
      for(var j=0;j<shuffled.length;j++){
        var p2=shuffled[j],key2=p2.name+"|"+p2.club;
        if(S.pickedMap[key2]) continue;
        if(targetPos!=="WC"&&isClubBlocked(picker,p2.club)) continue;
        S.pickedMap[key2]=picker;
        team[targetPos].push(Object.assign({},p2,{pickNumber:i+1}));
        break;
      }
    }
  }
  S.pickIdx=S.snakeOrder.length;
  S.draftOrder.forEach(function(name){
    var t=S.teams[name]||{},players=[];
    ["GK","DEF","MID","ATT"].forEach(function(pos){(t[pos]||[]).forEach(function(p){players.push(p);});});
    if(players.length>=2) S.captains[name]={player:players[1],dateSet:new Date().toISOString()};
  });
  for(var gw=1;gw<=5;gw++){
    var gwScores={};
    Object.keys(S.pickedMap).forEach(function(key){gwScores[key]=Math.floor(Math.random()*12);});
    S.scores[gw]=gwScores;
  }
  S.currentGW=5;
  S.draftDone=true; S.hideDraft=true;
  saveAll();
  renderTopBar(); checkCaptainBanner();
  document.querySelectorAll(".nav-btn[data-tab='pool']").forEach(function(b){b.style.display="";});
  showToast("Test data filled — 5 GWs of fake scores generated!");
  closeModal();
  showTab("myteam");
}

function exportBackup(){
  var backup={
    version:1,
    exportedAt:new Date().toISOString(),
    myName:S.myName,
    draftOrder:S.draftOrder,
    clubMax:S.clubMax,
    draftDone:S.draftDone,
    teams:S.teams,
    pickedMap:S.pickedMap,
    snakeOrder:S.snakeOrder,
    pickIdx:S.pickIdx,
    captains:S.captains,
    wildcardSubs:S.wildcardSubs,
    scores:S.scores,
    currentGW:S.currentGW,
    lastRefreshed:S.lastRefreshed,
    playerPool:S.playerPool,
    clubs:PL_CLUBS
  };
  var json=JSON.stringify(backup,null,2);
  var blob=new Blob([json],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="draft-advisor-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Backup downloaded!");
}

function importBackup(){
  var input=document.createElement("input");
  input.type="file"; input.accept=".json";
  input.onchange=function(e){
    var file=e.target.files[0];
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var backup=JSON.parse(ev.target.result);
        if(!backup.version||!backup.myName) throw new Error("Invalid backup file");
        showModal('<h3>Restore Backup?</h3><p style="color:#8b949e;font-size:13px;margin-bottom:14px;">Backup from '+new Date(backup.exportedAt).toLocaleDateString()+' for '+backup.myName+'. This will overwrite your current data.</p><button class="btn btn-blue" onclick="doImportBackup('+encodeURIComponent(JSON.stringify(backup))+')">Restore</button><button class="btn btn-gray" style="margin-top:8px;" onclick="closeModal()">Cancel</button>');
      }catch(err){
        showToast("Invalid backup file: "+err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function doImportBackup(encodedData){
  try{
    var backup=JSON.parse(decodeURIComponent(encodedData));
    S.myName=backup.myName||"";
    S.draftOrder=backup.draftOrder||[];
    S.clubMax=backup.clubMax||2;
    S.draftDone=backup.draftDone||false;
    S.teams=backup.teams||{};
    S.pickedMap=backup.pickedMap||{};
    S.snakeOrder=backup.snakeOrder||[];
    S.pickIdx=backup.pickIdx||0;
    S.captains=backup.captains||{};
    S.wildcardSubs=backup.wildcardSubs||{};
    S.scores=backup.scores||{};
    S.currentGW=backup.currentGW||1;
    S.lastRefreshed=backup.lastRefreshed||null;
    S.playerPool=backup.playerPool||[];
    if(backup.clubs&&backup.clubs.length>0) PL_CLUBS=backup.clubs;
    saveAll();
    closeModal();
    showToast("Backup restored!");
    setTimeout(function(){location.reload();},1000);
  }catch(e){
    showToast("Restore failed: "+e.message);
  }
}

    html += makeWelcomeBtn('&#x25B6; Continue Draft','#10b981',function(){showScreen('main');showTab('draft');});
    html += makeWelcomeBtn('&#x1F464; My Team So Far','#1f6feb',function(){showScreen('main');showTab('myteam');});
    html += makeWelcomeBtn('&#x2699; Settings','#30363d',function(){showScreen('main');showTab('settings');});
  } else if(hasDraft){
    html += makeWelcomeBtn('&#x1F3DF; Start Draft','#10b981',function(){showScreen('main');showTab('draft');});
    html += makeWelcomeBtn('&#x2699; Settings','#30363d',function(){showScreen('main');showTab('settings');});
  } else {
    html += makeWelcomeBtn('&#x26BD; Set Up New Draft','#10b981',function(){showScreen('setup');});
    if(hasSavedData){
      html += makeWelcomeBtn('&#x2B06; Restore from Backup','#30363d',function(){importBackup();});
    }
  }

  // Always show settings access
  if(hasDraft && !html.includes('Settings')){
    html += makeWelcomeBtn('&#x2699; Settings','#21262d',function(){showScreen('main');showTab('settings');});
  }

  btns.innerHTML = html;
}

var welcomeBtnFns={};
function makeWelcomeBtn(label, color, fn){
  var id = 'wb'+Object.keys(welcomeBtnFns).length;
  welcomeBtnFns[id] = fn;
  var txtColor = (color==='#30363d'||color==='#21262d') ? '#f0f6fc' : '#fff';
  return '<button onclick="welcomeBtnFns[\'' + id + '\']();" style="width:100%;padding:16px;background:'+color+';color:'+txtColor+';border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:0.2px;">'+label+'</button>';
}

// ── POOL TAB ───────────────────────────────────────────────────────────────────
var poolClubFilter="ALL",poolPosFilter="ALL",poolSort="pts_desc",poolShow="all";

function renderPoolTab(){
  var el=document.getElementById("tab-pool");
  if(!el) return;
  var allPlayers=S.playerPool.slice();
  // Attach draft info and current season points to each player
  allPlayers=allPlayers.map(function(p){
    var key=p.name+"|"+p.club;
    var picker=S.pickedMap[key]||null;
    var pts=0;
    for(var g=1;g<=S.currentGW;g++) pts+=(S.scores[g]||{})[key]||0;
    return Object.assign({},p,{picker:picker,seasonPts:pts});
  });

  // Top undrafted scorers
  var undrafted=allPlayers.filter(function(p){return !p.picker;}).sort(function(a,b){return b.seasonPts-a.seasonPts;});
  var topMiss=undrafted[0]||null;

  // Filters
  var filtered=allPlayers.slice();
  if(poolClubFilter!=="ALL") filtered=filtered.filter(function(p){return p.club===poolClubFilter;});
  if(poolPosFilter!=="ALL") filtered=filtered.filter(function(p){return p.position===poolPosFilter;});
  if(poolShow==="undrafted") filtered=filtered.filter(function(p){return !p.picker;});
  if(poolShow==="drafted") filtered=filtered.filter(function(p){return !!p.picker;});

  // Sort
  filtered.sort(function(a,b){
    if(poolSort==="pts_desc") return b.seasonPts-a.seasonPts;
    if(poolSort==="pts_asc") return a.seasonPts-b.seasonPts;
    if(poolSort==="rating") return b.rating-a.rating;
    if(poolSort==="name") return a.name.localeCompare(b.name);
    return 0;
  });

  var posColors={GK:"#f59e0b",DEF:"#3b82f6",MID:"#10b981",ATT:"#ef4444"};
  var html='<div style="padding:14px;overflow-y:auto;flex:1;">';

  // Summary strip
  html+='<div class="stat-grid" style="margin-bottom:12px;">'
    +'<div class="stat-card"><div class="sv">'+undrafted.length+'</div><div class="sl">Undrafted Players</div></div>'
    +'<div class="stat-card"><div class="sv">'+(topMiss?topMiss.seasonPts:0)+'</div><div class="sl">'+(topMiss?"Best Undrafted ("+topMiss.name+")":"Best Undrafted")+'</div></div>'
    +'</div>';

  // Filter bar
  html+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">';

  // Club dropdown
  html+='<select onchange="poolClubFilter=this.value;renderPoolTab();" style="flex:1;min-width:120px;padding:8px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#f0f6fc;font-size:13px;font-family:inherit;">';
  html+='<option value="ALL"'+(poolClubFilter==="ALL"?" selected":"")+'>All Clubs</option>';
  PL_CLUBS.forEach(function(c){html+='<option value="'+c+'"'+(poolClubFilter===c?" selected":"")+'>'+c+'</option>';});
  html+='</select>';

  // Position filter
  html+='<select onchange="poolPosFilter=this.value;renderPoolTab();" style="padding:8px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#f0f6fc;font-size:13px;font-family:inherit;">';
  ["ALL","GK","DEF","MID","ATT"].forEach(function(pos){html+='<option value="'+pos+'"'+(poolPosFilter===pos?" selected":"")+'>'+pos+'</option>';});
  html+='</select>';

  // Sort
  html+='<select onchange="poolSort=this.value;renderPoolTab();" style="padding:8px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#f0f6fc;font-size:13px;font-family:inherit;">';
  [["pts_desc","Pts (High)"],["pts_asc","Pts (Low)"],["rating","Rating"],["name","Name"]].forEach(function(o){html+='<option value="'+o[0]+'"'+(poolSort===o[0]?" selected":"")+'>'+o[1]+'</option>';});
  html+='</select>';

  // Show filter
  html+='<select onchange="poolShow=this.value;renderPoolTab();" style="padding:8px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#f0f6fc;font-size:13px;font-family:inherit;">';
  [["all","All Players"],["undrafted","Undrafted"],["drafted","Drafted"]].forEach(function(o){html+='<option value="'+o[0]+'"'+(poolShow===o[0]?" selected":"")+'>'+o[1]+'</option>';});
  html+='</select>';

  html+='</div>';

  // Player count
  html+='<div style="color:#484f58;font-size:12px;margin-bottom:10px;">'+filtered.length+' players</div>';

  // Player list
  filtered.forEach(function(p){
    var dim=p.picker?0.5:1;
    var borderCol=p.picker?"#21262d":"#30363d";
    var pickerLabel=p.picker?'<span style="font-size:11px;color:#8b949e;margin-left:6px;">Picked by '+p.picker+'</span>':'<span style="font-size:11px;color:#10b981;margin-left:6px;">Available</span>';
    html+='<div style="background:#161b22;border:1px solid '+borderCol+';border-radius:10px;padding:10px 14px;margin-bottom:5px;opacity:'+dim+';">'
      +'<div style="display:flex;align-items:center;gap:10px;">'
      +'<span class="badge badge-'+p.position+'">'+p.position+'</span>'
      +'<div style="flex:1;">'
      +'<div style="font-size:14px;font-weight:700;color:#f0f6fc;">'+p.name+pickerLabel+'</div>'
      +'<div style="font-size:12px;color:#8b949e;">'+p.club+' &middot; &pound;'+p.fplPrice+'m &middot; &#x2B50;'+p.rating+'/10</div>'
      +'</div>'
      +'<div style="text-align:right;">'
      +'<div style="color:#10b981;font-size:16px;font-weight:700;">'+p.seasonPts+'pts</div>'
      +'<div style="color:#484f58;font-size:11px;">this season</div>'
      +'</div></div></div>';
  });

  if(filtered.length===0) html+='<div style="padding:30px;text-align:center;color:#484f58;">No players match these filters</div>';
  html+='</div>';
  el.innerHTML=html;
}

// ── ENHANCED STATS ─────────────────────────────────────────────────────────────
function renderStatsSection(standings){
  var allPts=[];
  S.draftOrder.forEach(function(name){
    var t=S.teams[name]||{};
    ["GK","DEF","MID","ATT"].forEach(function(pos){
      (t[pos]||[]).forEach(function(p){
        allPts.push({name:p.name,club:p.club,pos:p.position,owner:name,pts:getPlayerPts(p.name+"|"+p.club,name)});
      });
    });
  });
  allPts.sort(function(a,b){return b.pts-a.pts;});
  var top5=allPts.slice(0,5);
  var bot5=allPts.slice(-5).reverse();

  var bestGW=S.draftOrder.map(function(name){
    var best=0,bestG=0;
    for(var g=1;g<=S.currentGW;g++){var pts=getPersonGWPts(name,g);if(pts>best){best=pts;bestG=g;}}
    return {name:name,pts:best,gw:bestG};
  }).sort(function(a,b){return b.pts-a.pts;});

  var html='';

  // Top/bottom players
  html+='<div class="sec-hdr">Top 5 Individual Players</div><table class="tbl" style="margin-bottom:16px;"><thead><tr><th>#</th><th>Player</th><th>Club</th><th>Owner</th><th>Pts</th></tr></thead><tbody>';
  top5.forEach(function(p,i){html+='<tr><td>'+(i+1)+'</td><td><span class="badge badge-'+p.pos+'">'+p.pos+'</span> '+p.name+'</td><td style="font-size:12px;">'+p.club+'</td><td style="font-size:12px;">'+p.owner+'</td><td style="color:#10b981;font-weight:700;">'+p.pts+'</td></tr>';});
  html+='</tbody></table>';

  html+='<div class="sec-hdr">Bottom 5 Individual Players</div><table class="tbl" style="margin-bottom:16px;"><thead><tr><th>#</th><th>Player</th><th>Club</th><th>Owner</th><th>Pts</th></tr></thead><tbody>';
  bot5.forEach(function(p,i){html+='<tr><td>'+(i+1)+'</td><td><span class="badge badge-'+p.pos+'">'+p.pos+'</span> '+p.name+'</td><td style="font-size:12px;">'+p.club+'</td><td style="font-size:12px;">'+p.owner+'</td><td style="color:#ef4444;font-weight:700;">'+p.pts+'</td></tr>';});
  html+='</tbody></table>';

  // Best GW
  html+='<div class="sec-hdr">Best Single Gameweek</div><table class="tbl" style="margin-bottom:16px;"><thead><tr><th>Name</th><th>Best GW</th><th>Points</th></tr></thead><tbody>';
  bestGW.forEach(function(b){html+='<tr><td style="font-weight:700;">'+b.name+(b.name===S.myName?" &#x1F464;":"")+'</td><td>GW'+(b.gw||"-")+'</td><td style="color:#10b981;font-weight:700;">'+b.pts+'</td></tr>';});
  html+='</tbody></table>';

  // Week by week rank changes
  html+='<div class="sec-hdr">Gameweek Rank Changes</div>';
  html+='<div style="overflow-x:auto;margin-bottom:16px;"><table class="tbl"><thead><tr><th>Name</th>';
  for(var g=1;g<=Math.min(S.currentGW,10);g++) html+='<th>GW'+g+'</th>';
  html+='</tr></thead><tbody>';
  S.draftOrder.forEach(function(name){
    html+='<tr><td style="font-weight:700;">'+name+(name===S.myName?" &#x1F464;":"")+'</td>';
    var prevRank=null;
    for(var g=1;g<=Math.min(S.currentGW,10);g++){
      var ranked=S.draftOrder.map(function(n){return {name:n,pts:getPersonTotalPts(n,g)};}).sort(function(a,b){return b.pts-a.pts;});
      var rank=ranked.findIndex(function(r){return r.name===name;})+1;
      var arrow="";
      if(prevRank!==null){
        if(rank<prevRank) arrow='<span style="color:#10b981;">&#x25B2;</span>';
        else if(rank>prevRank) arrow='<span style="color:#ef4444;">&#x25BC;</span>';
        else arrow='<span style="color:#484f58;">&#x2014;</span>';
      }
      html+='<td style="font-size:12px;">'+arrow+rank+'</td>';
      prevRank=rank;
    }
    html+='</tr>';
  });
  html+='</tbody></table></div>';

  // Points by position chart
  html+='<div class="sec-hdr">Points by Position</div>';
  html+='<div class="chart-wrap"><canvas id="pos-chart"></canvas></div>';

  // Monthly performance chart
  html+='<div class="sec-hdr">Monthly Performance</div>';
  html+='<div class="chart-wrap"><canvas id="monthly-chart"></canvas></div>';

  // Captain efficiency
  html+='<div class="sec-hdr">Captain Efficiency</div>';
  html+='<table class="tbl" style="margin-bottom:16px;"><thead><tr><th>Name</th><th>Captain</th><th>Cap Pts</th><th>Best Player</th><th>Best Pts</th><th>Efficiency</th></tr></thead><tbody>';
  S.draftOrder.forEach(function(name){
    var cap=S.captains[name];
    if(!cap) return;
    var capKey=cap.player.name+"|"+cap.player.club;
    var capPts=getPlayerPts(capKey,name);
    // Find best non-captain player
    var team=S.teams[name]||{},bestPts=0,bestName="";
    ["GK","DEF","MID","ATT"].forEach(function(pos){
      (team[pos]||[]).forEach(function(p){
        var key=p.name+"|"+p.club;
        if(key===capKey) return;
        var pts=getPlayerPts(key,name);
        if(pts>bestPts){bestPts=pts;bestName=p.name;}
      });
    });
    var rawCapPts=Math.round(capPts/2); // un-double to compare fairly
    var efficient=rawCapPts>=bestPts;
    html+='<tr><td style="font-weight:700;">'+name+'</td><td style="font-size:12px;">'+cap.player.name+'</td><td style="color:#10b981;">'+rawCapPts+'</td><td style="font-size:12px;">'+bestName+'</td><td>'+bestPts+'</td><td>'+(efficient?'<span style="color:#10b981;">&#x2713; Good</span>':'<span style="color:#ef4444;">&#x2717; Suboptimal</span>')+'</td></tr>';
  });
  html+='</tbody></table>';

  return html;
}

function drawExtraCharts(){
  drawPosChart();
  drawMonthlyChart();
}

function drawPosChart(){
  var ctx=document.getElementById("pos-chart");
  if(!ctx) return;
  var positions=["GK","DEF","MID","ATT"];
  var datasets=S.draftOrder.map(function(name,i){
    return {
      label:name,
      data:positions.map(function(pos){
        var t=S.teams[name]||{},total=0;
        (t[pos]||[]).forEach(function(p){total+=getPlayerPts(p.name+"|"+p.club,name);});
        return total;
      }),
      backgroundColor:CHART_COLORS[i%CHART_COLORS.length]+"99",
      borderColor:CHART_COLORS[i%CHART_COLORS.length],
      borderWidth:1
    };
  });
  new Chart(ctx,{type:"bar",data:{labels:positions,datasets:datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#8b949e",font:{size:11}}}},scales:{x:{ticks:{color:"#484f58"}},y:{ticks:{color:"#484f58"},grid:{color:"#21262d"}}}}});
}

function drawMonthlyChart(){
  var ctx=document.getElementById("monthly-chart");
  if(!ctx) return;
  // Group gameweeks by month (approx: 4 GWs per month starting Aug)
  var months=["Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar","Apr","May"];
  var gwPerMonth=Math.ceil(38/months.length);
  var labels=[];
  var monthData={};
  S.draftOrder.forEach(function(name){monthData[name]=[];});
  for(var m=0;m<months.length;m++){
    var startGW=m*gwPerMonth+1,endGW=Math.min((m+1)*gwPerMonth,S.currentGW);
    if(startGW>S.currentGW) break;
    labels.push(months[m]);
    S.draftOrder.forEach(function(name){
      var total=0;
      for(var g=startGW;g<=endGW;g++) total+=getPersonGWPts(name,g);
      monthData[name].push(total);
    });
  }
  var datasets=S.draftOrder.map(function(name,i){
    return {label:name,data:monthData[name],backgroundColor:CHART_COLORS[i%CHART_COLORS.length]+"99",borderColor:CHART_COLORS[i%CHART_COLORS.length],borderWidth:1};
  });
  new Chart(ctx,{type:"bar",data:{labels:labels,datasets:datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#8b949e",font:{size:11}}}},scales:{x:{ticks:{color:"#484f58"}},y:{ticks:{color:"#484f58"},grid:{color:"#21262d"}}}}});
}
